<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a09" />
<title>林间小屋 · Forest Cabin</title>
<meta name="description" content="完全程序化生成的 3D 森林农舍：黄金时刻逆光、手作原木屋、真实植被与电影级调色，零外部素材。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316120e'/%3E%3Cpath d='M16 5 L27 16 H22.5 V26 H9.5 V16 H5 Z' fill='%23c98a4b'/%3E%3Crect x='14' y='19' width='4' height='7' fill='%23ffc98a'/%3E%3C/svg%3E" />
<style>
  :root{ --ink:#f4eee4; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0a09;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%}
  #loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 120%,#2a2118 0%,#14110e 45%,#0a0908 100%);
    transition:opacity 1s ease .1s,visibility 1s ease .1s}
  #loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
  #loading .brand{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:clamp(26px,4.4vw,44px);
    letter-spacing:.42em;text-indent:.42em;text-shadow:0 2px 30px rgba(255,170,90,.22)}
  #loading .sub{margin-top:14px;font-size:11.5px;letter-spacing:.34em;text-indent:.34em;color:rgba(244,238,228,.42)}
  #loading .bar{margin-top:32px;width:min(300px,56vw);height:2px;background:rgba(244,238,228,.14);
    position:relative;overflow:hidden;border-radius:2px}
  #loading .bar>i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);
    background:linear-gradient(90deg,rgba(255,180,105,.35),#ffb469);transition:transform .5s ease}
  #loading .stage{margin-top:14px;font-size:11px;letter-spacing:.2em;color:rgba(244,238,228,.4);height:14px}
  #loading .tip{position:absolute;bottom:8vh;font-size:11px;letter-spacing:.18em;color:rgba(244,238,228,.26)}
  #fatal{position:fixed;inset:0;z-index:90;display:none;padding:36px;overflow:auto;background:rgba(10,8,7,.95);
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.7;color:#d9cfc2}
  #fatal.show{display:block}
  #fatal h2{font-family:"Songti SC",Georgia,serif;color:#ff9d6b;letter-spacing:.1em;margin:0 0 8px;font-size:19px}
  #ui-root{position:fixed;inset:0;z-index:30;pointer-events:none}
  #ui-root>*{pointer-events:auto}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui-root"></div>

<div id="loading">
  <div class="brand">林間小屋</div>
  <div class="sub">FOREST CABIN · PROCEDURAL</div>
  <div class="bar"><i></i></div>
  <div class="stage" id="load-stage">正在准备渲染器…</div>
  <div class="tip">全部几何与贴图都在浏览器里实时生成，没有任何外部素材</div>
</div>

<div id="fatal"><h2>场景加载失败</h2><pre id="fatal-body"></pre></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
