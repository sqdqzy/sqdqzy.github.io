<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森林中的农村小屋 - 3D 场景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0c1410; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; background: #0c1410; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #a9d6a9; font-size: 16px; letter-spacing: 2px;
    transition: opacity 1s ease; opacity: 1; user-select: none;
  }
  #loading .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(169,214,169,.2);
    border-top-color: #7fb57f; border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hide { opacity: 0; pointer-events: none; }

  #hud {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
    text-align: center; color: #e8f0e4; pointer-events: none; z-index: 5;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  #hud h1 { font-size: 26px; font-weight: 600; letter-spacing: 4px; margin-bottom: 6px; }
  #hud p { font-size: 13px; color: #b8cbb8; letter-spacing: 2px; }

  #controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: #9fb89f; font-size: 12px; letter-spacing: 1px; opacity: .75;
    pointer-events: none; z-index: 5; text-align: center; background: rgba(0,0,0,.25);
    padding: 8px 18px; border-radius: 20px; backdrop-filter: blur(4px);
  }
  #controls span { margin: 0 10px; color: #cfe0cf; }

  @media (max-width: 600px) {
    #hud h1 { font-size: 19px; }
    #controls { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>正在加载森林场景...</div>
</div>

<div id="hud">
  <h1>森林中的农村小屋</h1>
  <p>Forest Cabin · 拖动视角 · 滚轮缩放</p>
</div>

<div id="controls">
  <span>🖱 左键拖动旋转</span>
  <span>🔍 滚轮缩放</span>
  <span>👆 右键平移</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ============ 场景 ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc4e6);
scene.fog = new THREE.Fog(0x9bc4e6, 45, 180);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(18, 9, 22);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 6;
controls.maxDistance = 60;

/* ============ 灯光 ============ */
const ambient = new THREE.HemisphereLight(0xbcd0e0, 0x3a5a3a, 0.5);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xffeacc, 2.2);
sunLight.position.set(30, 40, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 120;
sunLight.shadow.camera.left = -35;
sunLight.shadow.camera.right = 35;
sunLight.shadow.camera.top = 35;
sunLight.shadow.camera.bottom = -35;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x9db8ff, 0.35);
fillLight.position.set(-20, 15, -15);
scene.add(fillLight);

/* ============ 天空 ============ */
const sky = new Sky();
sky.scale.setScalar(450);
scene.add(sky);
const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 6;
skyUniforms['rayleigh'].value = 1.5;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;
skyUniforms['sunPosition'].value.set(30, 40, 15);
scene.add(sky);

function makeCloud(x, y, z, s) {
  const cloudGroup = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, transparent: true, opacity: 0.8,
    roughness: 1, metalness: 0, flatShading: true
  });
  const geo = new THREE.SphereGeometry(1, 8, 8);
  const parts = [
    [0,0,0,1.6],[1.4,-0.3,0.2,1.1],[-1.3,-0.2,0.1,1.0],
    [0.5,0.6,0.3,1.0],[-0.4,0.5,-0.2,0.8]
  ];
  parts.forEach(p => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(p[0], p[1], p[2]);
    m.scale.setScalar(p[3]);
    cloudGroup.add(m);
  });
  cloudGroup.position.set(x, y, z);
  cloudGroup.scale.setScalar(s);
  scene.add(cloudGroup);
  return cloudGroup;
}
const clouds = [];
clouds.push(makeCloud(-30, 22, -40, 1.6));
clouds.push(makeCloud(35, 28, -55, 2.0));
clouds.push(makeCloud(-45, 30, -60, 1.4));

/* ============ 地面 ============ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(140, 96),
  new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* 林间小路 */
function makePath() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x8a6f4f, roughness: 1, metalness: 0 });
  const pts = [
    [0,0.03,6],[1.5,0.03,9],[1.2,0.03,13],[-0.8,0.03,17],[0.4,0.03,21],[2.2,0.03,25]
  ];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = new THREE.Vector3(pts[i][0], pts[i][1], pts[i][2]);
    const b = new THREE.Vector3(pts[i+1][0], pts[i+1][1], pts[i+1][2]);
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
    const tile = new THREE.Mesh(new THREE.PlaneGeometry(1.7, len), mat);
    tile.rotation.x = -Math.PI/2;
    tile.position.copy(mid);
    tile.rotation.z = -Math.atan2(dir.x, dir.z);
    tile.receiveShadow = true;
    scene.add(tile);
  }
}
makePath();

/* ============ 小屋 ============ */
const house = new THREE.Group();
const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8d9b0, roughness: 0.9, metalness: 0 });
const wallH = 3.2, wallW = 5.2, wallD = 4.2;
const beamMat = new THREE.MeshStandardMaterial({ color: 0x6b4e2f, roughness: 0.7, metalness: 0 });

const walls = new THREE.Mesh(new THREE.BoxGeometry(wallW, wallH, wallD), wallMat);
walls.position.y = wallH/2;
walls.castShadow = true;
walls.receiveShadow = true;
house.add(walls);

function addBeam(x, y, z, w, h, d) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), beamMat);
  b.position.set(x, y, z);
  b.castShadow = true;
  house.add(b);
}
addBeam(-wallW/2+0.15, 1.3, -wallD/2+0.15, 0.3, wallH, 0.3);
addBeam(wallW/2-0.15, 1.3, -wallD/2+0.15, 0.3, wallH, 0.3);
addBeam(-wallW/2+0.15, 1.3, wallD/2-0.15, 0.3, wallH, 0.3);
addBeam(wallW/2-0.15, 1.3, wallD/2-0.15, 0.3, wallH, 0.3);

/* 门 */
const doorMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1f, roughness: 0.6, metalness: 0 });
const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 0.12), doorMat);
door.position.set(0, 1.05, wallD/2+0.06);
door.castShadow = true;
house.add(door);

const frameMat = new THREE.MeshStandardMaterial({ color: 0x8a6b45, roughness: 0.7, metalness: 0 });
function addFrame(x, y, z, w, h) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.15), frameMat);
  f.position.set(x, y, z);
  house.add(f);
}
addFrame(0, 0.05, wallD/2, 1.3, 0.12);
addFrame(0, 2.2, wallD/2, 1.3, 0.12);
addFrame(-0.66, 1.1, wallD/2, 0.15, 2.2);
addFrame(0.66, 1.1, wallD/2, 0.15, 2.2);

/* 窗 */
const windowMat = new THREE.MeshStandardMaterial({ color: 0x2c4a63, roughness: 0.3, metalness: 0.1 });
const frame2Mat = new THREE.MeshStandardMaterial({ color: 0xf5efe0, roughness: 0.7, metalness: 0 });
function addWindow(x, y, z) {
  const glass = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.9, 0.08), windowMat);
  glass.position.set(x, y, z);
  house.add(glass);
  const hf = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 0.14), frame2Mat);
  hf.position.set(x, y+0.45, z); house.add(hf);
  const lf = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 0.14), frame2Mat);
  lf.position.set(x, y-0.45, z); house.add(lf);
  const vf = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 0.14), frame2Mat);
  vf.position.set(x, y, z); house.add(vf);
}
addWindow(-1.7, 1.75, wallD/2+0.02);
addWindow(1.7, 1.75, wallD/2+0.02);
addWindow(-wallW/2-0.02, 1.75, 0.8);

/* 屋顶（双坡） */
const roofMat = new THREE.MeshStandardMaterial({
  color: 0x8a3a2a, roughness: 0.85, metalness: 0, flatShading: true
});
const roofOverhang = 0.7;
const ridgeY = wallH + 1.6;
const roofHalf = wallD/2 + roofOverhang;
const roofGeo = new THREE.PlaneGeometry(wallW + roofOverhang*2, roofHalf*1.3);

function addRoofHalf(side) {
  const angle = Math.atan2(ridgeY - wallH, roofHalf);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, (wallH + ridgeY)/2 + 0.15, side * (roofHalf/2 + 0.15));
  roof.rotation.x = side < 0 ? -angle : angle;
  roof.castShadow = true;
  house.add(roof);
}
addRoofHalf(-1);
addRoofHalf(1);

const ridge = new THREE.Mesh(new THREE.BoxGeometry(wallW + roofOverhang*2, 0.25, 0.35), roofMat);
ridge.position.set(0, ridgeY, 0);
ridge.castShadow = true;
house.add(ridge);

/* 烟囱 */
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9c8a7a, roughness: 0.9, metalness: 0 });
const chimneyBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.8, 0.7), stoneMat);
chimneyBody.position.set(1.6, ridgeY - 0.4, 0.9);
chimneyBody.castShadow = true;
house.add(chimneyBody);
const chimneyTop = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.25, 0.85), stoneMat);
chimneyTop.position.set(1.6, ridgeY + 0.15, 0.9);
house.add(chimneyTop);

scene.add(house);
house.position.y = 0;

/* ============ 炊烟 ============ */
const smokeParticles = [];
const maxSmoke = 60;
const smokeGeo = new THREE.SphereGeometry(1, 8, 8);
const smokeGroup = new THREE.Group();
scene.add(smokeGroup);
const chimneyTopWorld = new THREE.Vector3(1.6, ridgeY + 0.4, 0.9).add(house.position);

for (let i = 0; i < maxSmoke; i++) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xc8c8c8, transparent: true, opacity: 0.35, depthWrite: false
  });
  const m = new THREE.Mesh(smokeGeo, mat);
  m.visible = false;
  smokeGroup.add(m);
  smokeParticles.push({ mesh: m, life: 0, maxLife: 5 + Math.random()*3 });
}
let smokeIndex = 0;
function emitSmoke() {
  smokeIndex = (smokeIndex + 1) % maxSmoke;
  const p = smokeParticles[smokeIndex];
  p.mesh.visible = true;
  p.life = 0;
  p.mesh.position.set(
    chimneyTopWorld.x + (Math.random()-0.5)*0.15,
    chimneyTopWorld.y,
    chimneyTopWorld.z + (Math.random()-0.5)*0.15
  );
  p.mesh.scale.setScalar(0.25 + Math.random()*0.2);
  p.mesh.material.opacity = 0.35;
}

/* ============ 树木 ============ */
const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4028, roughness: 0.95, metalness: 0 });
const treeLeafMats = [
  new THREE.MeshStandardMaterial({ color: 0x2e6b2e, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x2a5f2a, roughness: 0.9, flatShading: true }),
];
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261018);

function makeTree(x, z, scale, leafMat) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.3*scale, 2.2*scale, 7), treeTrunkMat);
  trunk.position.y = 1.1*scale;
  trunk.castShadow = true;
  tree.add(trunk);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1.1*scale, 7, 7), leafMat);
  crown.position.y = 2.8*scale;
  crown.castShadow = true;
  tree.add(crown);
  const crown2 = new THREE.Mesh(new THREE.SphereGeometry(0.8*scale, 7, 7), leafMat);
  crown2.position.set(0.4*scale, 3.4*scale, 0);
  tree.add(crown2);
  tree.position.set(x, 0, z);
  tree.rotation.y = rng() * Math.PI * 2;
  const s = scale * (0.85 + rng()*0.4);
  tree.scale.setScalar(s);
  scene.add(tree);
}

for (let i = 0; i < 160; i++) {
  const angle = rng() * Math.PI * 2;
  const radius = 8 + rng() * 55;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
  const scale = 0.6 + rng() * 1.1;
  const leafMat = treeLeafMats[Math.floor(rng()*treeLeafMats.length)];
  makeTree(x, z, scale, leafMat);
}

/* 灌木 */
const bushMat = new THREE.MeshStandardMaterial({ color: 0x3f7a3f, roughness: 0.9, flatShading: true });
function makeBush(x, z, s) {
  const b = new THREE.Group();
  const b1 = new THREE.Mesh(new THREE.SphereGeometry(s, 6, 6), bushMat);
  b1.position.y = s*0.6; b1.castShadow = true; b.add(b1);
  const b2 = new THREE.Mesh(new THREE.SphereGeometry(s*0.7, 6, 6), bushMat);
  b2.position.set(0.4*s, s*0.5, 0.2*s); b.add(b2);
  b.position.set(x, 0, z);
  scene.add(b);
}
makeBush(3.2, 4.5, 0.9);
makeBush(-3.5, 5.0, 1.0);
makeBush(4.5, -4.0, 0.7);

/* 石头 */
const stoneMat2 = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.9, metalness: 0 });
function makeStone(x, z, s) {
  const st = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), stoneMat2);
  st.position.set(x, s*0.4, z);
  st.rotation.set(rng()*3, rng()*3, rng()*3);
  st.castShadow = true;
  st.receiveShadow = true;
  scene.add(st);
}
for (let i = 0; i < 8; i++) {
  makeStone(-2 + rng()*4, 7 + rng()*2, 0.15 + rng()*0.2);
}

/* ============ 后处理 ============ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 0.8;
ssaoPass.minDistance = 0.001;
ssaoPass.maxDistance = 0.04;
composer.addPass(ssaoPass);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.15, 0.6, 0.85);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============ 动画 ============ */
const clock = new THREE.Clock();
let smokeTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.elapsedTime;

  smokeTimer += dt;
  if (smokeTimer > 0.12) { smokeTimer = 0; emitSmoke(); }

  smokeParticles.forEach(p => {
    if (!p.mesh.visible) return;
    p.life += dt;
    if (p.life > p.maxLife) { p.mesh.visible = false; return; }
    const t = p.life / p.maxLife;
    p.mesh.position.y += dt * (0.5 + t*0.9);
    p.mesh.position.x += Math.sin(elapsed + p.life) * 0.003;
    p.mesh.position.z += Math.cos(elapsed*0.7 + p.life) * 0.003;
    p.mesh.scale.multiplyScalar(1 + dt*0.7);
    p.mesh.material.opacity = Math.max(0, 0.35 * (1 - t));
  });

  clouds.forEach((c, i) => {
    c.position.x += dt * 0.15 * (i % 2 === 0 ? 1 : -1);
    if (c.position.x > 60) c.position.x = -60;
    if (c.position.x < -60) c.position.x = 60;
  });

  controls.update();
  composer.render();
}

renderer.setAnimationLoop(() => {
  document.getElementById('loading').classList.add('hide');
  renderer.setAnimationLoop(null);
  animate();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
