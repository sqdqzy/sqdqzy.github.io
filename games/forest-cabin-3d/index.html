<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12100e" />
<title>林间小屋 · Forest Cabin</title>
<meta name="description" content="一个程序化生成的 3D 森林农村小屋场景：黄金时刻体积光、手作木屋、真实植被与电影级调色。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316120e'/%3E%3Cpath d='M16 5 L27 16 H22.5 V26 H9.5 V16 H5 Z' fill='%23c98a4b'/%3E%3Crect x='14' y='19' width='4' height='7' fill='%23ffc98a'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #f2ece1;
    --ink-dim: rgba(242, 236, 225, 0.62);
    --line: rgba(242, 236, 225, 0.16);
    --panel: rgba(18, 16, 14, 0.46);
    --panel-solid: rgba(16, 14, 12, 0.86);
    --accent: #ffb469;
    --accent-soft: rgba(255, 180, 105, 0.18);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, "Times New Roman", serif;
    --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0a09; color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; }
  canvas { display: block; }

  /* 电影黑边（letterbox）：提升「电影感」 */
  .letterbox { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 40; pointer-events: none; transition: height .7s cubic-bezier(.4,0,.2,1); }
  .letterbox.top { top: 0; }
  .letterbox.bottom { bottom: 0; }
  body.cinema .letterbox { height: 6.2vh; }
  body.booting .letterbox { height: 0; }

  /* 氛围暗角 + 轻微暗角渐变，叠在 canvas 之上、UI 之下 */
  #vignette {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background:
      radial-gradient(ellipse 78% 68% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.24) 78%, rgba(0,0,0,0.5) 100%);
    mix-blend-mode: multiply;
    opacity: .9;
  }

  /* ---------- 载入界面 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 120%, #2a2118 0%, #14110e 45%, #0a0908 100%);
    transition: opacity 1.1s ease .15s, visibility 1.1s ease .15s;
  }
  #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #loading .brand { font-family: var(--serif); font-size: clamp(26px, 4.4vw, 46px); letter-spacing: .42em; text-indent: .42em; color: #f6ecdd; text-shadow: 0 2px 30px rgba(255,170,90,.24); }
  #loading .sub { margin-top: 14px; font-size: 11.5px; letter-spacing: .34em; text-indent: .34em; color: rgba(242,236,225,.42); text-transform: uppercase; }
  #loading .bar { margin-top: 34px; width: min(320px, 56vw); height: 1px; background: rgba(242,236,225,.14); position: relative; overflow: hidden; }
  #loading .bar > i { position: absolute; inset: 0 100% 0 0; background: linear-gradient(90deg, rgba(255,180,105,.2), var(--accent)); transition: right .45s ease; }
  #loading .stage { margin-top: 16px; font-size: 11px; letter-spacing: .2em; color: rgba(242,236,225,.4); height: 14px; }
  #loading .tip { position: absolute; bottom: 8vh; font-size: 11px; letter-spacing: .18em; color: rgba(242,236,225,.28); }

  /* ---------- 致命错误 ---------- */
  #fatal {
    position: fixed; inset: 0; z-index: 90; display: none;
    padding: 42px; overflow: auto; background: rgba(10,8,7,.94);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7;
  }
  #fatal.show { display: block; }
  #fatal h2 { font-family: var(--serif); color: #ff9d6b; letter-spacing: .1em; margin: 0 0 6px; font-size: 20px; }
  #fatal pre { white-space: pre-wrap; color: #d9cfc2; }

  /* ---------- 内容容器（ui.js 自建 DOM 与样式于此） ---------- */
  #ui-root { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #ui-root > * { pointer-events: auto; }
  body.ui-hidden #ui-root, body.ui-hidden #vignette, body.ui-hidden .letterbox { opacity: 0; transition: opacity .4s ease; }
  body.shot #ui-root, body.shot #vignette, body.shot #loading { display: none !important; }
  body.shot .letterbox { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body class="booting cinema">

<canvas id="scene"></canvas>
<div id="vignette"></div>
<div class="letterbox top"></div>
<div class="letterbox bottom"></div>
<div id="ui-root"></div>

<div id="loading">
  <div class="brand">林間小屋</div>
  <div class="sub">Forest Cabin &nbsp;·&nbsp; Procedural Scene</div>
  <div class="bar"><i id="load-bar"></i></div>
  <div class="stage" id="load-stage">正在准备渲染器…</div>
  <div class="tip">拖动旋转 · 滚轮缩放 · 按 H 隐藏界面 · 按 C 切换电影运镜</div>
</div>

<div id="fatal"><h2>场景加载失败</h2><pre id="fatal-body"></pre></div>

<script>
  // 全局兜底：任何未捕获错误都显示在页面上，便于远程排查
  (function () {
    var shown = false;
    function show(msg) {
      if (shown) return; shown = true;
      var box = document.getElementById('fatal');
      var body = document.getElementById('fatal-body');
      if (box && body) { body.textContent = String(msg); box.classList.add('show'); }
      if (window.__scene) window.__scene.errors = (window.__scene.errors || []).concat([String(msg)]);
    }
    window.addEventListener('error', function (e) {
      show((e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + '\n' + ((e.error && e.error.stack) || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Unhandled rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
    });
    window.__fatal = show;
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
