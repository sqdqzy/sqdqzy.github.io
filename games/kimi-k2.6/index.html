<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林间小屋 · Forest Cabin</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b0f1c; height:100%; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  /* 暗角 —— 电影感 */
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, transparent 46%, rgba(2,4,10,0.55) 100%);
  }
  #title {
    position:fixed; top:36px; left:44px; z-index:10; pointer-events:none;
    color:#f2e8d8; font-family:"Songti SC","Noto Serif SC","STSong",serif;
    opacity:0; animation: fadein 3s ease 0.8s forwards;
  }
  #title h1 { margin:0; font-size:34px; font-weight:500; letter-spacing:10px; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  #title p  { margin:8px 0 0 2px; font-size:12px; letter-spacing:6px; color:rgba(242,232,216,.55); }
  #hint {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10; pointer-events:none;
    color:rgba(242,232,216,.45); font-family:"Songti SC","Noto Serif SC",serif;
    font-size:12px; letter-spacing:5px; opacity:0; animation: fadein 3s ease 2s forwards;
  }
  @keyframes fadein { to { opacity:1; } }
  #loader {
    position:fixed; inset:0; background:#0b0f1c; z-index:20;
    display:flex; align-items:center; justify-content:center; color:#8a8272;
    font-family:"Songti SC",serif; letter-spacing:8px; font-size:14px;
    transition: opacity 2s ease; pointer-events:none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title"><h1>林 间 小 屋</h1><p>FOREST CABIN · DUSK</p></div>
<div id="hint">拖 动 旋 转 &nbsp;·&nbsp; 滚 轮 缩 放</div>
<div id="loader">暮 色 将 至 …</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================== 基础 ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x27314d, 0.0135);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(17, 6.2, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);

/* ============================== 天空 ============================== */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 top  = vec3(0.045,0.065,0.16);
      vec3 mid  = vec3(0.20,0.18,0.32);
      vec3 hor  = vec3(0.48,0.26,0.22);
      vec3 c = mix(hor, mid, smoothstep(-0.02,0.22,h));
      c = mix(c, top, smoothstep(0.18,0.62,h));
      c += vec3(0.35,0.16,0.05) * pow(max(0.0,1.0-abs(h-0.02)*6.0),3.0) * 0.55; // 落日暖带
      gl_FragColor = vec4(c,1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(320, 32, 24), skyMat));

/* 星空 */
{
  const n=900, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const t=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*0.85), r=290;
    pos[i*3]=r*Math.sin(ph)*Math.cos(t); pos[i*3+1]=r*Math.cos(ph)+8; pos[i*3+2]=r*Math.sin(ph)*Math.sin(t);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0xcfd8ff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0.75,fog:false});
  scene.add(new THREE.Points(g,m));
}

/* 月亮 + 光晕 */
const moonPos = new THREE.Vector3(60, 55, -110);
{
  const moon = new THREE.Mesh(new THREE.SphereGeometry(6,24,24),
    new THREE.MeshBasicMaterial({ color:new THREE.Color(2.4,2.2,1.7), fog:false }));
  moon.position.copy(moonPos); scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture('rgba(220,225,255,1)'), color:0x8a94c8,
    transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
  halo.scale.setScalar(60); halo.position.copy(moonPos); scene.add(halo);
}

function glowTexture(rgb){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, rgb); g.addColorStop(0.35, rgb.replace('1)','0.5)')); g.addColorStop(1, rgb.replace('1)','0)'));
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}

/* ============================== 地形 ============================== */
function smoothstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
function groundH(x,z){
  const d=Math.hypot(x,z);
  const flat=smoothstep(9, 22, d);
  return (Math.sin(x*0.13)*Math.cos(z*0.17)*0.7
        + Math.sin(x*0.045+1.7)*Math.cos(z*0.06-0.5)*2.4
        + Math.sin(x*0.31)*Math.cos(z*0.27)*0.15) * flat;
}
{
  const R=110, seg=180;
  const geo=new THREE.CircleGeometry(R, seg, 0, Math.PI*2);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  const colors=new Float32Array(pos.count*3);
  const cA=new THREE.Color(0x24402a), cB=new THREE.Color(0x2e5233), cC=new THREE.Color(0x5d4426);
  const tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=groundH(x,z); pos.setY(i,h);
    const n=Math.sin(x*0.35+2.0)*Math.cos(z*0.29-1.0)*0.5+0.5;
    tmp.copy(cA).lerp(cB, n);
    if(Math.sin(x*0.09)*Math.cos(z*0.11+3.0) > 0.55) tmp.lerp(cC, 0.55); // 落叶色块
    tmp.multiplyScalar(0.75 + 0.25*smoothstep(2, -1, h));
    colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();
  const ground=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, metalness:0}));
  ground.receiveShadow=true; scene.add(ground);
}

/* ============================== 灯光 ============================== */
scene.add(new THREE.HemisphereLight(0x6a7bb0, 0x1f2a1a, 0.5));

const sun=new THREE.DirectionalLight(0xffa050, 2.4);
sun.position.set(-38, 15, -20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-42; sun.shadow.camera.right=42;
sun.shadow.camera.top=42; sun.shadow.camera.bottom=-42;
sun.shadow.camera.near=1; sun.shadow.camera.far=140;
sun.shadow.bias=-0.0006;
scene.add(sun);

const fill=new THREE.DirectionalLight(0x50609a, 0.35);
fill.position.set(30, 20, 40); scene.add(fill);

/* ============================== 材质 ============================== */
const M={
  trunk:  new THREE.MeshStandardMaterial({color:0x4a3424, roughness:1, flatShading:true}),
  pineA:  new THREE.MeshStandardMaterial({color:0x24502f, roughness:1, flatShading:true}),
  pineB:  new THREE.MeshStandardMaterial({color:0x2c5e36, roughness:1, flatShading:true}),
  autumnA:new THREE.MeshStandardMaterial({color:0xb45a20, roughness:1, flatShading:true}),
  autumnB:new THREE.MeshStandardMaterial({color:0xc98a2a, roughness:1, flatShading:true}),
  stone:  new THREE.MeshStandardMaterial({color:0x6b6660, roughness:1, flatShading:true}),
  wood:   new THREE.MeshStandardMaterial({color:0x8a6b4f, roughness:0.9}),
  woodDk: new THREE.MeshStandardMaterial({color:0x5a4030, roughness:0.95}),
  roof:   new THREE.MeshStandardMaterial({color:0x3a2c22, roughness:1, flatShading:true}),
  warmWin:new THREE.MeshStandardMaterial({color:0x1a1006, emissive:0xff9a3d, emissiveIntensity:2.6}),
  bush:   new THREE.MeshStandardMaterial({color:0x1e3a24, roughness:1, flatShading:true}),
};

function mesh(geo, mat, x,y,z, cast=true, recv=true){
  const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  m.castShadow=cast; m.receiveShadow=recv; return m;
}

/* ============================== 松树 ============================== */
const pines=[];
function makeTree(x,z,s,autumn){
  const g=new THREE.Group();
  const y=groundH(x,z)-0.15;
  const trunk=mesh(new THREE.CylinderGeometry(0.16*s,0.26*s,1.6*s,6), M.trunk, 0,0.8*s,0);
  g.add(trunk);
  const cols = autumn ? [M.autumnA,M.autumnB] : [M.pineA,M.pineB];
  let r=1.5*s, h=1.5*s, yy=1.5*s;
  for(let i=0;i<3;i++){
    const c=mesh(new THREE.ConeGeometry(r, h, 7), cols[Math.floor(Math.random()*2)], 0, yy+h/2, 0);
    c.rotation.y=Math.random()*Math.PI; g.add(c);
    r*=0.72; yy+=h*0.55; h*=0.85;
  }
  g.position.set(x,y,z);
  g.rotation.y=Math.random()*Math.PI*2;
  g.rotation.z=(Math.random()-0.5)*0.05;
  const sc=s*(0.85+Math.random()*0.4); g.scale.setScalar(sc);
  scene.add(g); pines.push(g);
}
for(let i=0;i<150;i++){
  const a=Math.random()*Math.PI*2;
  const rad=15+Math.pow(Math.random(),1.4)*80;
  const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
  if(Math.hypot(x,z)<13) continue;
  if(x>0 && z>4 && x<7 && z<22) continue; // 留出路
  makeTree(x, z, 0.9+Math.random()*0.9, Math.random()<0.22);
}

/* 灌木 & 蘑菇 */
for(let i=0;i<34;i++){
  const a=Math.random()*Math.PI*2, rad=8+Math.random()*28;
  const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
  if(Math.hypot(x,z)<7) continue;
  const b=mesh(new THREE.IcosahedronGeometry(0.5+Math.random()*0.7,0), M.bush, x, groundH(x,z)+0.25, z);
  b.scale.y=0.7; b.rotation.y=Math.random()*3; scene.add(b);
}
{
  const stemM=new THREE.MeshStandardMaterial({color:0xe8e0cc, roughness:1});
  const capM =new THREE.MeshStandardMaterial({color:0xb03a2a, roughness:0.8, flatShading:true});
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2, rad=6+Math.random()*20;
    const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
    const y=groundH(x,z);
    const s=0.6+Math.random()*0.6;
    const g=new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(0.06*s,0.09*s,0.3*s,6), stemM, 0,0.15*s,0));
    g.add(mesh(new THREE.ConeGeometry(0.22*s,0.2*s,8), capM, 0,0.34*s,0));
    g.position.set(x,y,z); scene.add(g);
  }
}

/* 草丛（实例化） */
{
  const geo=new THREE.ConeGeometry(0.05, 0.55, 4);
  const mat=new THREE.MeshStandardMaterial({roughness:1, flatShading:true});
  const N=900;
  const inst=new THREE.InstancedMesh(geo, mat, N);
  const d=new THREE.Object3D(); const col=new THREE.Color();
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, rad=5+Math.random()*40;
    const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
    d.position.set(x, groundH(x,z)+0.22, z);
    d.rotation.set((Math.random()-0.5)*0.5, Math.random()*3, (Math.random()-0.5)*0.5);
    d.scale.setScalar(0.7+Math.random()*1.1); d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
    col.setHSL(0.32+Math.random()*0.06, 0.45, 0.16+Math.random()*0.1);
    inst.setColorAt(i, col);
  }
  inst.instanceColor.needsUpdate=true;
  scene.add(inst);
}

/* ============================== 小屋 ============================== */
const cabin=new THREE.Group();
{
  const W=6.4, D=5.4, wallH=2.6, baseH=0.5, ridge=1.7;
  const top=baseH+wallH;

  cabin.add(mesh(new THREE.BoxGeometry(W+0.8, baseH, D+0.8), M.stone, 0, baseH/2, 0));
  cabin.add(mesh(new THREE.BoxGeometry(W, wallH, D), M.wood, 0, baseH+wallH/2, 0));

  /* 木骨架线条 */
  for(const sx of [-1,1]) for(const sz of [-1,1])
    cabin.add(mesh(new THREE.BoxGeometry(0.3, wallH, 0.3), M.woodDk, sx*(W/2-0.02), baseH+wallH/2, sz*(D/2-0.02)));
  for(const y of [baseH+0.35, baseH+wallH-0.35])
    cabin.add(mesh(new THREE.BoxGeometry(W+0.08, 0.16, D+0.08), M.woodDk, 0, y, 0));

  /* 屋顶 */
  const half=W/2, ang=Math.atan2(ridge, half), slope=Math.hypot(half, ridge);
  const r1=mesh(new THREE.BoxGeometry(slope+0.5, 0.18, D+1.2), M.roof, -half/2, top+ridge/2, 0);
  r1.rotation.z=ang;
  const r2=mesh(new THREE.BoxGeometry(slope+0.5, 0.18, D+1.2), M.roof,  half/2, top+ridge/2, 0);
  r2.rotation.z=-ang;
  cabin.add(r1,r2);

  /* 山墙 */
  const tri=new THREE.Shape();
  tri.moveTo(-half,0); tri.lineTo(half,0); tri.lineTo(0,ridge); tri.closePath();
  for(const sz of [-1,1]){
    const gable=new THREE.Mesh(new THREE.ShapeGeometry(tri), new THREE.MeshStandardMaterial({color:0x8a6b4f, roughness:0.9, side:THREE.DoubleSide}));
    gable.position.set(0, top, sz*(D/2+0.01)); gable.castShadow=true;
    cabin.add(gable);
  }

  /* 门 + 台阶 */
  cabin.add(mesh(new THREE.BoxGeometry(1.3, 2.1, 0.14), M.woodDk, 0, baseH+1.05, D/2+0.04));
  cabin.add(mesh(new THREE.BoxGeometry(1.0, 1.8, 0.1), M.wood, 0, baseH+0.95, D/2+0.12));
  const knob=mesh(new THREE.SphereGeometry(0.05,10,10), new THREE.MeshStandardMaterial({color:0xd8b25a, metalness:0.8, roughness:0.3}), 0.35, baseH+0.95, D/2+0.2);
  cabin.add(knob);
  cabin.add(mesh(new THREE.BoxGeometry(2.2,0.18,0.9), M.stone, 0, 0.28, D/2+0.6));

  /* 窗（暖光） */
  const winFrame=new THREE.BoxGeometry(1.0,1.0,0.12);
  const winGlass=new THREE.PlaneGeometry(0.78,0.78);
  function windowAt(x,y,z,ry=0){
    const g=new THREE.Group();
    g.add(mesh(winFrame, M.woodDk, 0,0,0));
    const gl=new THREE.Mesh(winGlass, M.warmWin); gl.position.z=0.03; g.add(gl);
    /* 窗棂 */
    g.add(mesh(new THREE.BoxGeometry(0.05,1.0,0.13), M.woodDk, 0,0,0));
    g.add(mesh(new THREE.BoxGeometry(1.0,0.05,0.13), M.woodDk, 0,0,0));
    g.position.set(x,y,z); g.rotation.y=ry;
    cabin.add(g);
  }
  windowAt(-1.9, baseH+1.5, D/2+0.03);
  windowAt( 1.9, baseH+1.5, D/2+0.03);
  windowAt( W/2+0.03, baseH+1.5, 0, Math.PI/2);

  /* 烟囱 */
  cabin.add(mesh(new THREE.BoxGeometry(0.85, 2.6, 0.85), M.stone, 1.8, top+0.9, -1.2));
  cabin.add(mesh(new THREE.BoxGeometry(1.1, 0.2, 1.1), M.stone, 1.8, top+2.25, -1.2));

  /* 门廊 */
  cabin.add(mesh(new THREE.BoxGeometry(3.2,0.16,1.6), M.wood, 0, 0.58, D/2+1.0));
  for(const sx of [-1.4,1.4])
    cabin.add(mesh(new THREE.CylinderGeometry(0.09,0.11,2.2,8), M.woodDk, sx, 0.58+1.1, D/2+1.7));
  const pro=mesh(new THREE.BoxGeometry(3.6,0.1,2.0), M.roof, 0, 3.0, D/2+1.15);
  pro.rotation.x=-0.18; cabin.add(pro);

  /* 灯笼 */
  const lamp=mesh(new THREE.SphereGeometry(0.13,12,12),
    new THREE.MeshStandardMaterial({color:0x201408, emissive:0xffc06a, emissiveIntensity:5}), 0, 2.7, D/2+1.45);
  cabin.add(lamp);
  const lampLight=new THREE.PointLight(0xffb36b, 6, 9, 2);
  lampLight.position.set(0, 2.7, D/2+1.6); cabin.add(lampLight);

  /* 窗光 */
  const wl=new THREE.PointLight(0xff9a3d, 5, 10, 2);
  wl.position.set(0, baseH+1.5, D/2+1.2); cabin.add(wl);
  const wl2=new THREE.PointLight(0xff9a3d, 3, 8, 2);
  wl2.position.set(W/2+1.2, baseH+1.5, 0); cabin.add(wl2);
}
scene.add(cabin);
const smokeOrigin = new THREE.Vector3(1.8, 0.5+2.6+0.9+2.5, -1.2);

/* 栅栏 */
{
  const fx=-7.5;
  for(let i=0;i<6;i++){
    const z=2+i*2.1;
    const y=groundH(fx,z);
    scene.add(mesh(new THREE.BoxGeometry(0.14,1.2,0.14), M.woodDk, fx, y+0.6, z));
    if(i<5){
      const y2=groundH(fx,z+2.1);
      for(const ry of [0.5,0.95]){
        const rail=mesh(new THREE.BoxGeometry(0.08,0.1,2.2), M.woodDk, fx, (y+y2)/2+ry, z+1.05);
        rail.rotation.x=Math.atan2(y2-y, 2.1);
        scene.add(rail);
      }
    }
  }
}

/* 石板路 */
{
  for(let i=0;i<11;i++){
    const t=i/10;
    const x=0.8 + t*3.2 + Math.sin(t*4)*0.9;
    const z=4.2 + t*15;
    const s=0.45+Math.random()*0.15;
    const st=mesh(new THREE.CylinderGeometry(s, s*1.1, 0.12, 7), M.stone, x, groundH(x,z)+0.05, z);
    st.rotation.y=Math.random()*3; scene.add(st);
  }
}

/* ============================== 炊烟 ============================== */
const smokes=[];
{
  const tex=glowTexture('rgba(200,200,215,1)');
  for(let i=0;i<26;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0, depthWrite:false}));
    sp.userData={ age:Math.random()*6, speed:0.55+Math.random()*0.3, wob:Math.random()*Math.PI*2 };
    smokes.push(sp); scene.add(sp);
  }
}

/* ============================== 萤火虫 ============================== */
const fliesN=80, fliesPos=new Float32Array(fliesN*3), fliesCol=new Float32Array(fliesN*3), fliesBase=[];
{
  const c=new THREE.Color();
  for(let i=0;i<fliesN;i++){
    const a=Math.random()*Math.PI*2, rad=4+Math.random()*20;
    const b={x:Math.cos(a)*rad, z:Math.sin(a)*rad, y:0.5+Math.random()*2.6, ph:Math.random()*Math.PI*2, sp:0.3+Math.random()*0.7};
    fliesBase.push(b);
    fliesPos.set([b.x,b.y,b.z], i*3);
    c.setRGB(2.2,2.6,0.5); fliesCol.set([c.r,c.g,c.b], i*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(fliesPos,3));
  g.setAttribute('color', new THREE.BufferAttribute(fliesCol,3));
  const m=new THREE.PointsMaterial({size:0.28, map:glowTexture('rgba(230,255,160,1)'), vertexColors:true,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true});
  window._fliesGeo=g; window._fliesMat=m;
  scene.add(new THREE.Points(g,m));
}

/* ============================== 后期：辉光 ============================== */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.7, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================== 动画 ============================== */
const clock=new THREE.Clock();
let frames=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  /* 炊烟 */
  for(const sp of smokes){
    sp.userData.age+=dt;
    if(sp.userData.age>6){ sp.userData.age=0; sp.userData.wob=Math.random()*Math.PI*2; }
    const a=sp.userData.age;
    sp.position.set(
      smokeOrigin.x + Math.sin(a*0.9+sp.userData.wob)*0.35*(a*0.35) + a*0.55,
      smokeOrigin.y + a*sp.userData.speed,
      smokeOrigin.z + Math.cos(a*0.7+sp.userData.wob)*0.3*(a*0.35)
    );
    sp.scale.setScalar(0.6+a*0.75);
    sp.material.opacity=0.3*smoothstep(0,1.2,a)*(1-smoothstep(3.5,6,a));
  }

  /* 萤火虫 */
  const g=window._fliesGeo;
  for(let i=0;i<fliesN;i++){
    const b=fliesBase[i];
    fliesPos[i*3]  =b.x + Math.sin(t*b.sp+b.ph)*1.6;
    fliesPos[i*3+1]=b.y + Math.sin(t*b.sp*1.4+b.ph*2)*0.7;
    fliesPos[i*3+2]=b.z + Math.cos(t*b.sp*0.8+b.ph)*1.6;
  }
  g.attributes.position.needsUpdate=true;
  window._fliesMat.opacity=0.55+0.45*Math.sin(t*2.1);

  /* 灯光呼吸 */
  const flick=0.92+0.08*Math.sin(t*7.3)*Math.sin(t*3.1);
  cabin.children.forEach(c=>{ if(c.isPointLight) c.intensity=c.userData.i ?? (c.userData.i=c.intensity); });
  cabin.traverse(o=>{ if(o.isPointLight) o.intensity=o.userData.i*(0.9+0.1*Math.sin(t*5+o.userData.i)); });

  controls.update();
  composer.render();

  if(++frames===8){ const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),2200); }
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
