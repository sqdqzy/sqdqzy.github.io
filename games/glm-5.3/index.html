<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暮林小筑 · 黄昏的森林木屋</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a1218; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }

  /* —— 电影感覆盖层 —— */
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(3,7,10,.5) 100%);
  }
  .bar-top,.bar-bottom{
    position:fixed; left:0; right:0; height:30px; z-index:6; pointer-events:none;
  }
  .bar-top{ top:0; background:linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  .bar-bottom{ bottom:0; background:linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0)); }

  /* —— 片头字幕式排版 —— */
  .ui{ position:fixed; z-index:10; color:#e8dcc8; pointer-events:none;
       font-family:'Noto Serif SC', serif; }
  .ui-title{ left:42px; bottom:46px; }
  .eyebrow{
    font-family:'Cormorant Garamond', serif; font-size:12px; letter-spacing:.55em;
    color:#b9a06a; text-transform:uppercase; margin-bottom:10px;
    opacity:0; animation:rise 1.6s ease .9s forwards;
  }
  .title{
    font-size:34px; font-weight:600; letter-spacing:.34em;
    text-shadow:0 2px 18px rgba(0,0,0,.65);
    opacity:0; animation:rise 1.6s ease 1.15s forwards;
  }
  .rule{
    width:118px; height:1px; margin:16px 0 12px;
    background:linear-gradient(to right, #b9a06a, rgba(185,160,106,0));
    opacity:0; animation:rise 1.6s ease 1.4s forwards;
  }
  .status{
    font-size:13.5px; letter-spacing:.22em; color:#c9bda6;
    opacity:0; animation:rise 1.6s ease 1.6s forwards;
    transition:opacity .6s ease;
  }
  .ui-hint{ right:42px; bottom:46px; text-align:right; font-size:12px;
    letter-spacing:.18em; color:#9aa596; line-height:2.1;
    opacity:0; animation:rise 1.6s ease 1.9s forwards; }
  .ui-hint b{ color:#d7c8a5; font-weight:400; }
  .ui-corner{ font-family:'Cormorant Garamond',serif; font-size:11px;
    letter-spacing:.4em; color:#7c8a8c; }
  .ui-tl{ left:42px; top:34px; opacity:0; animation:rise 1.6s ease 2.1s forwards; }
  .ui-tr{ right:42px; top:34px; opacity:0; animation:rise 1.6s ease 2.1s forwards; }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none; } }

  /* —— 开场黑幕 —— */
  #fade{ position:fixed; inset:0; background:#000; z-index:20;
    transition:opacity 2.4s ease; pointer-events:none; }
</style>
</head>
<body>

<div id="stage"></div>

<div class="vignette"></div>
<div class="bar-top"></div>
<div class="bar-bottom"></div>

<div class="ui ui-tl ui-corner">FOREST&nbsp;CABIN&nbsp;·&nbsp;DUSK</div>
<div class="ui ui-tr ui-corner">REALTIME&nbsp;·&nbsp;WEBGL</div>

<div class="ui ui-title">
  <div class="eyebrow">Twilight · Forest Cabin</div>
  <div class="title">暮 林 小 筑</div>
  <div class="rule"></div>
  <div class="status" id="status">炊烟向晚，窗火可归</div>
</div>

<div class="ui ui-hint">
  <b>拖拽</b> 环视森林&nbsp;&nbsp;·&nbsp;&nbsp;<b>滚轮</b> 推近小屋<br>
  <b>轻点小屋</b>&nbsp;&nbsp;掌一盏灯，或让它熄于夜色
</div>

<div id="fade"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
/* ============================================================
   暮林小筑 —— 黄昏森林木屋 · 全程序化实时三维场景
   ============================================================ */
(function(){
'use strict';
if(!window.THREE){ document.getElementById('status').textContent = '三维引擎加载失败，请检查网络'; return; }

/* ---------- 工具 ---------- */
const rand  = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.floor(rand(a,b+1));
const pick  = arr => arr[randi(0,arr.length-1)];

/* 地形高度函数（小屋附近压平，保证建筑贴合地面） */
function terrainH(x,z){
  let h = Math.sin(x*0.16)*Math.cos(z*0.14)*0.55
        + Math.sin(x*0.34+1.7)*Math.sin(z*0.27)*0.3
        + Math.cos(x*0.09-0.4)*Math.sin(z*0.11+2.1)*0.6;
  const d = Math.sqrt(x*x + z*z);
  const flat = THREE.MathUtils.smoothstep(d, 7.5, 13); // 7.5 内完全平坦
  return h * flat;
}

/* canvas 径向渐变纹理 */
function radialTex(size, stops, blobs){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  stops.forEach(s=> g.addColorStop(s[0], s[1]));
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  if(blobs){ // 叠加絮状斑块，让烟更蓬松
    for(let i=0;i<blobs;i++){
      const bx = rand(size*0.3,size*0.7), by = rand(size*0.3,size*0.7), br = rand(size*0.08,size*0.2);
      const g2 = ctx.createRadialGradient(bx,by,0,bx,by,br);
      g2.addColorStop(0,'rgba(255,255,255,0.35)'); g2.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(bx,by,br,0,7); ctx.fill();
    }
  }
  const t = new THREE.CanvasTexture(c); return t;
}

/* ---------- 场景基座 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x18262e, 0.031); // 暮色浓雾，远树朦胧

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(11, 4.8, 12.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 1.5, 0.3);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 28;
controls.maxPolarAngle = 1.52; // 不许钻到地下
controls.autoRotate = true; controls.autoRotateSpeed = -0.5;
let idleTimer = null;
controls.addEventListener('start', ()=>{ controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end',   ()=>{ idleTimer = setTimeout(()=> controls.autoRotate = true, 4000); });

/* ---------- 灯光系统（冷暖双主调） ---------- */
// 半球光：暮色天光打底
scene.add(new THREE.HemisphereLight(0x2a3a46, 0x131a12, 0.5));
// 月光：低角度冷蓝方向光，负责树影
const moonLight = new THREE.DirectionalLight(0x7391b3, 0.55);
moonLight.position.set(-18, 24, -12);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -24; moonLight.shadow.camera.right = 24;
moonLight.shadow.camera.top = 24;   moonLight.shadow.camera.bottom = -24;
moonLight.shadow.camera.near = 1;   moonLight.shadow.camera.far = 70;
moonLight.shadow.bias = -0.0008; moonLight.shadow.normalBias = 0.03;
scene.add(moonLight);

/* 屋内暖光：点光源真实投阴影，光只能从门窗洞透出 —— 这是画面的灵魂 */
const innerLight = new THREE.PointLight(0xffab5e, 2.6, 15, 2);
innerLight.position.set(0.4, 1.6, 0.3);
innerLight.castShadow = true;
innerLight.shadow.mapSize.set(1024,1024);
innerLight.shadow.bias = -0.006;
scene.add(innerLight);

/* ---------- 天空穹顶（着色器渐变 + 西天余晖） ---------- */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(170, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vDir;
      void main(){
        float h = clamp(vDir.y, -0.05, 1.0);
        vec3 top = vec3(0.035,0.075,0.114);
        vec3 mid = vec3(0.105,0.180,0.216);
        vec3 hor = vec3(0.180,0.243,0.263);
        vec3 col = mix(hor, mid, smoothstep(0.0,0.30,h));
        col = mix(col, top, smoothstep(0.26,0.78,h));
        // 西边天际残照
        float glow = pow(max(dot(normalize(vec3(vDir.x,0.,vDir.z)), normalize(vec3(-0.72,0.,0.45))),0.0),3.0);
        col += vec3(0.34,0.16,0.06) * glow * (1.0-smoothstep(0.0,0.42,h));
        gl_FragColor = vec4(col,1.0);
      }`
  })
));

/* 星星（两组交替呼吸） */
const starDot = radialTex(32, [[0,'rgba(255,255,255,1)'],[1,'rgba(255,255,255,0)']]);
function starField(n, phase){
  const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th = rand(0,Math.PI*2), ph = rand(0.05,1.35), r = 150;
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({ map:starDot, size:1.6, sizeAttenuation:false,
    transparent:true, depthWrite:false, color:0xcfe0ee });
  const p = new THREE.Points(g,m); p.userData.phase = phase; scene.add(p); return p;
}
const starsA = starField(260, 0), starsB = starField(180, 2.4);

/* 月亮 + 月晕 */
const moonPos = new THREE.Vector3(-52, 44, -34);
const moon = new THREE.Mesh(new THREE.CircleGeometry(3.4, 32),
  new THREE.MeshBasicMaterial({ color:0xe6eef5, fog:false }));
moon.position.copy(moonPos); moon.lookAt(0,0,0); scene.add(moon);
const moonGlowMat = new THREE.SpriteMaterial({ map:radialTex(128,[[0,'rgba(190,215,235,0.85)'],[0.4,'rgba(150,180,210,0.25)'],[1,'rgba(150,180,210,0)']]),
  blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, fog:false });
const moonGlow = new THREE.Sprite(moonGlowMat);
moonGlow.position.copy(moonPos); moonGlow.scale.setScalar(22); scene.add(moonGlow);

/* ---------- 地面（顶点色 + 高低起伏） ---------- */
{
  const g = new THREE.PlaneGeometry(140, 140, 120, 120);
  g.rotateX(-Math.PI/2);
  const p = g.attributes.position, colors = new Float32Array(p.count*3);
  const cA = new THREE.Color(0x25301e), cB = new THREE.Color(0x37452b), tmp = new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, terrainH(x,z));
    const n = 0.5 + 0.5*Math.sin(x*0.42+z*0.31)*Math.cos(x*0.13-z*0.2) + rand(-0.12,0.12);
    tmp.copy(cA).lerp(cB, THREE.MathUtils.clamp(n,0,1));
    colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors,3));
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1 }));
  ground.receiveShadow = true; scene.add(ground);
}

/* ---------- 蜿蜒石板小路 ---------- */
const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.55, 0, 2.9), new THREE.Vector3(1.7, 0, 5.1),
  new THREE.Vector3(3.3, 0, 7.6), new THREE.Vector3(5.0, 0, 10.4),
  new THREE.Vector3(7.4, 0, 13.8)
]);
{
  const stoneMats = [0x4a4136, 0x544a3d, 0x413a32].map(c=>
    new THREE.MeshStandardMaterial({ color:c, roughness:1, flatShading:true }));
  const len = pathCurve.getLength(), n = Math.floor(len/0.62);
  for(let i=0;i<=n;i++){
    const t = i/n, pt = pathCurve.getPoint(t);
    const s = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.3,0.45), 0), pick(stoneMats));
    s.position.set(pt.x + rand(-0.14,0.14), terrainH(pt.x,pt.z)+0.03, pt.z + rand(-0.1,0.1));
    s.scale.y = 0.22; s.rotation.y = rand(0,6.28);
    s.receiveShadow = true; scene.add(s);
  }
  // 门口两级台阶
  [[0.15,3.05,0.55],[0.3,2.72,0.6]].forEach(d=>{
    const st = new THREE.Mesh(new THREE.DodecahedronGeometry(d[2],0), stoneMats[0]);
    st.position.set(d[0], 0.02, d[1]); st.scale.set(1.1,0.2,0.9); st.rotation.y = 0.4;
    st.receiveShadow = true; scene.add(st);
  });
}

/* ---------- 小屋：原木墙 · 人字木瓦顶 · 石烟囱 ---------- */
const cabin = new THREE.Group(); scene.add(cabin);
const windowMats = [], windowGlows = [];
const logMat   = new THREE.MeshStandardMaterial({ color:0x6b4a2f, roughness:0.95, flatShading:true });
const logMat2  = new THREE.MeshStandardMaterial({ color:0x5e412a, roughness:0.95, flatShading:true });
const darkWood = new THREE.MeshStandardMaterial({ color:0x33241a, roughness:1 });
const LOG_R = 0.155, LOG_STEP = 0.31, LAYERS = 7;

/* 挖洞定义 */
const doorHole = { x0:-0.52, x1:0.52, y0:0, y1:2.12 };
const winF_L = { x0:-1.95, x1:-1.05, y0:0.95, y1:1.95 };
const winF_R = { x0: 1.05, x1: 1.95, y0:0.95, y1:1.95 };
const winR   = { z0:-0.62, z1: 0.28, y0:0.95, y1:1.85 }; // 右墙侧窗

function addLog(len, x, y, z, alongZ, mat){
  const g = new THREE.CylinderGeometry(LOG_R, LOG_R, len, 9);
  g.rotateZ(Math.PI/2); if(alongZ) g.rotateY(Math.PI/2);
  const m = new THREE.Mesh(g, mat || (Math.random()<0.5?logMat:logMat2));
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; cabin.add(m); return m;
}

/* 前后墙：按洞分段的原木 */
function buildFrontBack(){
  for(let i=0;i<LAYERS;i++){
    const y = 0.16 + LOG_STEP*i;
    // 计算实心区间
    let segs = [[-2.28, 2.28]];
    const cut = hole => {
      if(y+LOG_R > hole.y0 && y-LOG_R < hole.y1){
        segs = segs.flatMap(s => {
          const out = [];
          if(s[0] < hole.x0 - 0.01) out.push([s[0], Math.min(s[1], hole.x0)]);
          if(s[1] > hole.x1 + 0.01) out.push([Math.max(s[0], hole.x1), s[1]]);
          return out;
        });
      }
    };
    cut(doorHole); cut(winF_L); cut(winF_R);
    segs.forEach(s => { if(s[1]-s[0] > 0.08) addLog(s[1]-s[0], (s[0]+s[1])/2, y, 1.7, false); });
    // 后墙整根
    addLog(4.58, 0, y, -1.7, false);
  }
}
/* 左右侧墙：端头交错咬合 + 右墙挖侧窗 */
function buildSides(){
  for(let i=0;i<LAYERS;i++){
    const y = 0.16 + LOG_STEP*i;
    const L = i%2 ? 3.9 : 2.95;
    addLog(L, -2.2, y, 0, true); // 左墙
    // 右墙按侧窗分段
    let segs = [[-L/2, L/2]];
    if(y+LOG_R > winR.y0 && y-LOG_R < winR.y1){
      segs = segs.flatMap(s=>{
        const out=[];
        if(s[0] < winR.z0-0.01) out.push([s[0], Math.min(s[1], winR.z0)]);
        if(s[1] > winR.z1+0.01) out.push([Math.max(s[0], winR.z1), s[1]]);
        return out;
      });
    }
    segs.forEach(s=>{ if(s[1]-s[0]>0.08) addLog(s[1]-s[0], 2.2, y, (s[0]+s[1])/2, true); });
  }
}
buildFrontBack(); buildSides();

/* 山墙：阶梯状短原木堆成三角 */
for(const sideZ of [1.7, -1.7]){
  for(let j=0;j<4;j++){
    const y = 2.32 + j*0.3;
    const halfW = 2.25 * (1 - (y-2.18)/(3.62-2.18)) ;
    if(halfW > 0.15) addLog(halfW*2+0.12, 0, y, sideZ, false);
  }
}

/* 屋顶：坡面 + 层叠木瓦 */
{
  const pitch = Math.atan(1.32/1.98);
  const shingleMats = [0x4a3626, 0x3f2d20, 0x46311f, 0x372719].map(c=>
    new THREE.MeshStandardMaterial({ color:c, roughness:1, flatShading:true }));
  for(const side of [1,-1]){
    // 底板
    const base = new THREE.Mesh(new THREE.BoxGeometry(5.15, 0.07, 2.55), darkWood);
    base.position.set(0, 2.92, side*1.02); base.rotation.x = -side*pitch;
    base.castShadow = base.receiveShadow = true; cabin.add(base);
    // 7 行木瓦，每行 6 段错缝
    for(let row=0; row<7; row++){
      const t = row/6;
      const y = 2.42 + t*1.26, z = side*(2.24 - t*1.9);
      for(let k=0;k<6;k++){
        const w = new THREE.Mesh(new THREE.BoxGeometry(rand(0.78,0.9), 0.09, 0.3), pick(shingleMats));
        w.position.set(-2.15 + k*0.86 + rand(-0.05,0.05), y + rand(-0.02,0.02), z);
        w.rotation.x = -side*pitch; w.rotation.y = rand(-0.03,0.03);
        w.castShadow = w.receiveShadow = true; cabin.add(w);
      }
    }
  }
  // 屋脊圆木
  const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,5.3,8), logMat2);
  ridge.rotation.z = Math.PI/2; ridge.position.set(0, 3.68, 0);
  ridge.castShadow = true; cabin.add(ridge);
}

/* 石砌烟囱 */
{
  const stoneM = [0x57534c, 0x4c4842, 0x5e5a52].map(c=>
    new THREE.MeshStandardMaterial({ color:c, roughness:1, flatShading:true }));
  for(let layer=0; layer<7; layer++){
    const y = 2.42 + layer*0.3;
    for(let k=0;k<4;k++){
      const s = new THREE.Mesh(new THREE.BoxGeometry(rand(0.3,0.42), rand(0.24,0.32), rand(0.3,0.42)), pick(stoneM));
      s.position.set(1.25 + (k%2?0.16:-0.16) + rand(-0.03,0.03), y, (k<2?0.14:-0.14) + rand(-0.03,0.03));
      s.rotation.set(rand(-0.06,0.06), rand(0,0.5), rand(-0.06,0.06));
      s.castShadow = true; cabin.add(s);
    }
  }
  // 烟囱口
  const mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.24,0.14,8),
    new THREE.MeshStandardMaterial({ color:0x1a1714, roughness:1 }));
  mouth.position.set(1.25, 4.55, 0); cabin.add(mouth);
}

/* 门框 + 半开的木门（暖光从门缝溢出） */
{
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.26, 2.3, 0.14), darkWood);
  frame.position.set(0, 1.1, 1.72); frame.castShadow = true; cabin.add(frame);
  const doorG = new THREE.Group(); doorG.position.set(-0.47, 0, 1.78); cabin.add(doorG);
  const plankM = new THREE.MeshStandardMaterial({ color:0x4a3524, roughness:0.9 });
  for(let i=0;i<3;i++){
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.98, 0.06), plankM);
    p.position.set(0.08+i*0.16, 1.0, 0); p.castShadow = true; doorG.add(p);
  }
  [[0.45],[1.55]].forEach(h=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.07, 0.03), darkWood);
    b.position.set(0.24, h[0], 0.045); doorG.add(b);
  });
  const knob = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.12,0.05),
    new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.5, metalness:0.7 }));
  knob.position.set(0.42, 1.02, 0.05); doorG.add(knob);
  doorG.rotation.y = -0.5; // 微开
}

/* 窗户：框 + 玻璃 + 十字棂 + 窗台檐 */
function makeWindow(cx, cy, cz, rotY, w, h){
  const grp = new THREE.Group(); grp.position.set(cx,cy,cz); grp.rotation.y = rotY;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.16, h+0.14, 0.1), darkWood);

/* ---------- 树木（近景可构图 / 远景朦胧） ---------- */
function makeTree(s, dark){
  const g = new THREE.Group();
  const trunkM = new THREE.MeshStandardMaterial({ color: dark?0x241a12:0x3e2c1e, roughness:1, flatShading:true });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.11*s, 0.3*s, 2.6*s, 6), trunkM);
  trunk.position.y = 1.25*s; trunk.rotation.z = rand(-0.05,0.05); trunk.rotation.x = rand(-0.05,0.05);
  trunk.castShadow = !dark; g.add(trunk);
  const base = new THREE.Color(dark?0x0e1a12:0x2a4630);
  for(let k=0;k<3;k++){
    const c = base.clone().offsetHSL(rand(-0.02,0.02), rand(-0.05,0.05), rand(-0.05,0.03));
    const cone = new THREE.Mesh(new THREE.ConeGeometry(s*(1.55-k*0.4), s*1.5, 7),
      new THREE.MeshStandardMaterial({ color:c, roughness:1, flatShading:true }));
    cone.position.set(rand(-0.15,0.15)*s, s*(1.9+k*0.78), rand(-0.15,0.15)*s);
    cone.rotation.y = rand(0,6.28); cone.castShadow = !dark; g.add(cone);
  }
  return g;
}

/* ---------- 粒子系统：萤火虫 / 光尘 / 炊烟 / 飘叶 ---------- */
function fireflyMaterial(color, opacity, size){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uColor:{value:new THREE.Color(color)}, uOpacity:{value:opacity}, uSize:{value:size} },
    vertexShader:`
      attribute float aPhase; attribute float aSpeed;
      uniform float uTime; uniform float uSize; varying float vTw;
      void main(){
        vec3 p = position;
        p.x += sin(uTime*aSpeed + aPhase)*1.5;
        p.y += sin(uTime*aSpeed*0.6 + aPhase*1.7)*0.55;
        p.z += cos(uTime*aSpeed*0.8 + aPhase*2.3)*1.5;
        vTw = pow(max(sin(uTime*aSpeed*1.9 + aPhase*4.1), 0.0), 3.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uSize * (170.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uOpacity; varying float vTw;
      void main(){
        float r = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.04, r) * vTw * uOpacity;
        gl_FragColor = vec4(uColor, a);
      }`
  });
}
function scatterPoints(n, rMin, rMax, yBase, ySpan){
  const pos = new Float32Array(n*3), ph = new Float32Array(n), sp = new Float32Array(n);
  for(let i=0;i<n;i++){
    const a = rand(0,Math.PI*2), r = rand(rMin,rMax);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    pos[i*3]=x; pos[i*3+1]=terrainH(x,z)+rand(yBase,yBase+ySpan); pos[i*3+2]=z;
    ph[i]=rand(0,20); sp[i]=rand(0.25,0.7);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph,1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(sp,1));
  return g;
}

const smokes = [];
for(let i=0;i<34;i++){
  const m = new THREE.SpriteMaterial({ map:smokeTex, transparent:true, opacity:0, depthWrite:false });
  const s = new THREE.Sprite(m); s.visible = false; scene.add(s);
  smokes.push({ s, m, age: rand(0,7), life: rand(6,9), seed: rand(0,20) });
}

/* 飘落的叶子 */
const fallingLeaves = [];
{
  const leafG = new THREE.PlaneGeometry(0.13, 0.16);
  const lm = [0x6e4a22, 0x7a3d1e, 0x5c4526].map(c=>
    new THREE.MeshStandardMaterial({ color:c, roughness:1, side:THREE.DoubleSide }));
  const trees = [[6.6,8.6,5.6],[-4.2,10.2,6.2],[7.5,-5.5,6.4],[-8.5,-3.5,6.8]];
  for(let i=0;i<8;i++){
    const t = pick(trees);
    const l = new THREE.Mesh(leafG, pick(lm));
    l.position.set(t[0]+rand(-1.2,1.2), t[2], t[1]+rand(-1.2,1.2));
    scene.add(l);
    fallingLeaves.push({ m:l, x:l.position.x, z:l.position.z, top:t[2],
      fall:rand(0.25,0.5), sw:rand(0,6.28), rot:rand(1,3) });
  }
}

/* ---------- 掌灯交互（点击小屋，缓动过渡） ---------- */
const lamp = { on:true, cur:1 };
const statusEl = document.getElementById('status');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return; // 拖拽不算点击
  mouse.x = (e.clientX/innerWidth)*2 - 1;
  mouse.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(mouse, camera);
  if(raycaster.intersectObject(cabin, true).length){
    lamp.on = !lamp.on;
    statusEl.style.opacity = 0;
    setTimeout(()=>{
      statusEl.textContent = lamp.on ? '炊烟向晚，窗火可归' : '夜色四合，山影入眠';
      statusEl.style.opacity = 1;
    }, 550);
  }
});

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
let time = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  controls.update();

  // 灯光缓动
  lamp.cur += (Number(lamp.on) - lamp.cur) * Math.min(1, dt*2.0);
  const c = lamp.cur;
  innerLight.intensity = 2.7*c;
  windowMats.forEach(m=> m.emissiveIntensity = 2.3*c + 0.04);
  windowGlows.forEach(g=> g.material.opacity = 0.85*c);
  poolMat.opacity = c;
  dustMat.uniforms.uOpacity.value = 0.55*c;
  lanternLight.intensity = 0.85 + Math.sin(time*2.1)*0.12;
  lanternGlowM.opacity = 0.8 + Math.sin(time*2.1)*0.18;
  lanternG.rotation.x = Math.sin(time*1.25)*0.07; // 灯笼轻摆
  lanternG.rotation.z = Math.cos(time*0.95)*0.06;
  bucketG.rotation.x = Math.sin(time*0.8)*0.05;   // 井桶微晃

  // 萤火虫 / 光尘
  fireflyMat.uniforms.uTime.value = time;
  dustMat.uniforms.uTime.value = time*0.45;

  // 星星交替呼吸
  starsA.material.opacity = 0.55 + 0.45*Math.sin(time*0.7);
  starsB.material.opacity = 0.55 + 0.45*Math.sin(time*0.7 + 2.4);

  // 炊烟：上升 · 膨胀 · 随风 · 淡出
  for(const sm of smokes){
    sm.age += dt;
    if(sm.age > sm.life){
      sm.age = 0; sm.s.visible = true;
      sm.s.position.set(1.25+rand(-0.08,0.08), 4.62, rand(-0.08,0.08));
    }
    if(!sm.s.visible) continue;
    const t = sm.age, life = sm.life;
    sm.s.position.x += (0.32*dt) * (0.4 + t*0.18);
    sm.s.position.z += (0.1*dt) * (0.4 + t*0.14);
    sm.s.position.y += dt * (1.05 - t*0.06);
    sm.s.position.x += Math.sin(time*0.8 + sm.seed)*0.004;
    sm.s.scale.setScalar(0.4 + t*0.85);
    sm.m.opacity = Math.sin(Math.PI * t/life) * 0.3 * (0.25 + 0.75*c);
  }

  // 飘叶
  for(const f of fallingLeaves){
    f.m.position.y -= f.fall*dt;
    f.m.position.x = f.x + Math.sin(time*1.1 + f.sw)*0.7;
    f.m.position.z = f.z + Math.cos(time*0.8 + f.sw)*0.5;
    f.m.rotation.x += f.rot*dt; f.m.rotation.y += f.rot*0.7*dt;
    f.m.rotation.z = Math.sin(time*1.4 + f.sw)*0.8;
    if(f.m.position.y < terrainH(f.m.position.x, f.m.position.z)+0.05)
      f.m.position.y = f.top;
  }

  renderer.render(scene, camera);
}
tick();

/* ---------- 自适应 & 开场淡入 ---------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(()=>{ document.getElementById('fade').style.opacity = 0; }, 900);
setTimeout(()=>{ document.getElementById('fade').remove(); }, 3600);
})();
</script>
</body>
