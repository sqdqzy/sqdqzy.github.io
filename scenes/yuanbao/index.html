<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>林间木屋 · Whispering Pines</title>
<style>
  :root{
    --ink: rgba(255,255,255,.92);
    --dim: rgba(255,255,255,.55);
    --glass: rgba(18,20,26,.34);
    --line: rgba(255,255,255,.14);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0d12; }
  body{
    font-family: "Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  canvas{ display:block; }

  #vignette-css{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(125% 95% at 50% 45%, rgba(0,0,0,0) 48%, rgba(0,0,0,.10) 80%, rgba(0,0,0,.26) 100%);
    mix-blend-mode: multiply;
  }

  /* ---------- UI ---------- */
  #ui{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  #ui > *{ pointer-events:auto; }

  .title{
    position:absolute; left:34px; top:30px;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }
  .title h1{
    font-size:26px; font-weight:600; letter-spacing:.22em; margin-bottom:6px;
  }
  .title p{
    font-size:11.5px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase;
  }
  .title .bar{
    width:46px; height:1px; background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,0));
    margin:12px 0 0;
  }

  .panel{
    position:absolute; right:26px; top:26px;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .seg{
    display:flex; gap:2px; padding:4px; border-radius:14px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 8px 30px rgba(0,0,0,.28);
  }
  .seg button{
    appearance:none; border:0; cursor:pointer; color:var(--dim);
    background:transparent; font:inherit; font-size:12.5px; letter-spacing:.12em;
    padding:8px 14px; border-radius:11px; transition:.28s cubic-bezier(.2,.8,.2,1);
    white-space:nowrap;
  }
  .seg button:hover{ color:var(--ink); background:rgba(255,255,255,.07); }
  .seg button.on{
    color:#14161c; background:rgba(255,255,255,.90); font-weight:600;
    box-shadow:0 3px 12px rgba(0,0,0,.25);
  }
  .toggle{
    display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;
    padding:8px 13px; border-radius:12px; font-size:12px; letter-spacing:.1em; color:var(--dim);
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:.25s;
  }
  .toggle:hover{ color:var(--ink); }
  .dot{
    width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35);
    box-shadow:none; transition:.3s;
  }
  .toggle.on .dot{ background:#ffd08a; box-shadow:0 0 10px 2px rgba(255,190,110,.75); }

  .hint{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    font-size:11.5px; letter-spacing:.2em; color:rgba(255,255,255,.42);
    text-shadow:0 2px 10px rgba(0,0,0,.6); white-space:nowrap;
  }
  .meta{
    position:absolute; left:34px; bottom:26px;
    font-size:11px; letter-spacing:.16em; color:rgba(255,255,255,.34); line-height:1.9;
  }

  /* ---------- loader ---------- */
  #loading{
    position:fixed; inset:0; z-index:20; background:#0a0c11;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity 1.1s ease; text-align:center; padding:20px;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  #loading .lt{ font-size:13px; letter-spacing:.4em; color:rgba(255,255,255,.6); }
  #loading .lg{ width:180px; height:1px; background:rgba(255,255,255,.14); overflow:hidden; }
  #loading .lg i{ display:block; height:100%; width:0%; background:rgba(255,255,255,.85); animation: prog 1.7s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes prog{ 0%{width:4%} 55%{width:72%} 100%{width:98%} }
  #loading .err{ font-size:12.5px; letter-spacing:.08em; color:#ff9c8a; max-width:520px; line-height:1.9; display:none; }

  @media (max-width:720px){
    .title{ left:20px; top:20px; } .title h1{ font-size:19px; letter-spacing:.16em; }
    .panel{ right:14px; top:16px; } .seg button{ padding:7px 10px; font-size:11px; }
    .meta{ display:none; } .hint{ font-size:10px; letter-spacing:.12em; }
  }
</style>
</head>
<body>

<div id="vignette-css"></div>

<div id="ui">
  <div class="title">
    <h1>林间木屋</h1>
    <p>Whispering Pines</p>
    <div class="bar"></div>
  </div>

  <div class="panel">
    <div class="seg" id="seg-time">
      <button data-p="dusk" class="on">黄昏</button>
      <button data-p="night">星夜</button>
      <button data-p="morning">晨雾</button>
    </div>
    <div class="toggle on" id="tg-orbit"><span class="dot"></span><span>自动环绕</span></div>
  </div>

  <div class="hint">拖动旋转 · 滚轮推拉 · 右键平移</div>
  <div class="meta">
    THREE.JS · 程序化生成<br>
    森林 / 木屋 / 池塘 / 体积光
  </div>
</div>

<div id="loading">
  <div class="lt">正在生长这片森林</div>
  <div class="lg"><i id="lgbar"></i></div>
  <div class="err" id="lerr"></div>
</div>

<script id="main-src" type="text/plain">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   0. 基础工具
   ========================================================================= */
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;
const smoothstep = THREE.MathUtils.smoothstep;
const rnd = THREE.MathUtils.randFloat;
const rndInt = THREE.MathUtils.randInt;

// 确定性伪随机（保证每次打开布局一致）
let _seed = 20261018;
function rand(){
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}
function rr(a,b){ return a + (b-a)*rand(); }

function hash2(x,y){
  let n = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x,y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x,y){
  let s = 0, amp = .5, f = 1;
  for(let i=0;i<4;i++){ s += amp*vnoise(x*f, y*f); f *= 2.03; amp *= .5; }
  return s;
}

/* 初始视线走廊：避免树木挡住开局的取景 */
const VIEW_A = new THREE.Vector2(11.5, 14.8);   // 相机初始位置（xz）
const VIEW_B = new THREE.Vector2(0.0, 0.0);     // 视线终点：木屋
function distToViewLine(px, pz){
  const ax = VIEW_A.x, az = VIEW_A.y, bx = VIEW_B.x, bz = VIEW_B.y;
  const dx = bx-ax, dz = bz-az;
  const len2 = dx*dx + dz*dz;
  const t = clamp(((px-ax)*dx + (pz-az)*dz) / len2, 0, 1);
  return Math.hypot(px - (ax + t*dx), pz - (az + t*dz));
}

/* 地形高度：中心（木屋区）平坦，外围起伏，池塘处凹陷 */
const POND = new THREE.Vector2(14.5, -11.5);
function heightAt(x,z){
  let h  = (fbm(x*0.045+31.7, z*0.045-11.3) - .5) * 7.0;
  h += (fbm(x*0.16-7.1, z*0.16+4.2) - .5) * 1.35;
  h += (fbm(x*0.42, z*0.42) - .5) * 0.28;

  const d = Math.sqrt(x*x + z*z);
  const flat = smoothstep(d, 9.5, 26.0);
  h *= flat;

  // 池塘洼地：陡岸处理，保证水面边缘始终被岸坡自然遮挡
  const dp = Math.hypot(x - POND.x, z - POND.y);
  const k = smoothstep(dp, 5.4, 8.4);
  const bed = -1.05 + (fbm(x*0.3, z*0.3) - .5) * 0.35;   // 池底
  const bank = Math.max(h, 0.20);                        // 岸（始终高于水面）
  const pondH = lerp(bed, bank, k);
  // 影响范围之外回归自然地形
  h = lerp(pondH, h, smoothstep(dp, 9.6, 13.6));
  return h;
}

/* =========================================================================
   1. 渲染器 / 场景 / 相机
   ========================================================================= */
const LOW_END = Math.min(innerWidth, innerHeight) < 780 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const renderer = new THREE.WebGLRenderer({ antialias:!LOW_END, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW_END ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9a7a68, 0.0085);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(11.5, 5.0, 14.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.7, 0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.7;
controls.panSpeed = 0.5;
controls.minDistance = 6.5;
controls.maxDistance = 52;
controls.minPolarAngle = 0.42;
controls.maxPolarAngle = 1.47;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;

/* =========================================================================
   2. 程序化贴图
   ========================================================================= */
function cv(size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return { c, x: c.getContext('2d') };
}
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx||1, ry||1);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noiseTex(size, base, patches, scale){
  const { c, x } = cv(size);
  x.fillStyle = base; x.fillRect(0,0,size,size);
  for(let i=0;i<patches;i++){
    const px = Math.random()*size, py = Math.random()*size;
    const r = (2 + Math.random()*10) * scale;
    const g = x.createRadialGradient(px,py,0, px,py,r);
    const col = patches > 0 ? `rgba(${120+Math.random()*110|0},${120+Math.random()*110|0},${90+Math.random()*90|0},${0.05+Math.random()*0.12})` : '';
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill();
  }
  // 细颗粒
  const img = x.getImageData(0,0,size,size), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*26;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  x.putImageData(img,0,0);
  return c;
}

/* 木纹（原木 / 木板通用） */
function woodCanvas(seedTone){
  const S = 256, { c, x } = cv(S);
  const g = x.createLinearGradient(0,0,0,S);
  g.addColorStop(0, seedTone[0]); g.addColorStop(1, seedTone[1]);
  x.fillStyle = g; x.fillRect(0,0,S,S);
  // 纵向木纹条
  for(let i=0;i<70;i++){
    const px = Math.random()*S;
    const w = 1 + Math.random()*5;
    x.globalAlpha = 0.05 + Math.random()*0.16;
    x.fillStyle = Math.random() > .5 ? '#3a2415' : '#8a6440';
    x.beginPath();
    x.moveTo(px, 0);
    for(let y=0;y<=S;y+=16) x.lineTo(px + Math.sin(y*0.05 + i)*3.5, y);
    x.lineTo(px+w, S);
    for(let y=S;y>=0;y-=16) x.lineTo(px+w + Math.sin(y*0.05 + i)*3.5, y);
    x.closePath(); x.fill();
  }
  x.globalAlpha = 1;
  // 结疤
  for(let i=0;i<7;i++){
    const px = Math.random()*S, py = Math.random()*S, r = 3+Math.random()*7;
    const rg = x.createRadialGradient(px,py,0,px,py,r);
    rg.addColorStop(0,'rgba(30,18,10,.85)'); rg.addColorStop(1,'rgba(30,18,10,0)');
    x.fillStyle = rg; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill();
  }
  // 颗粒
  const img = x.getImageData(0,0,S,S), d = img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*20; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(img,0,0);
  return c;
}

/* 屋顶木瓦 */
function shingleCanvas(){
  const S = 256, { c, x } = cv(S);
  x.fillStyle = '#3b2a20'; x.fillRect(0,0,S,S);
  const rows = 16, rh = S/rows;
  for(let r=0;r<rows;r++){
    const off = (r%2) * (S/16);
    for(let i=-1;i<9;i++){
      const px = i*(S/8) + off, py = r*rh;
      const shade = 40 + Math.random()*46;
      x.fillStyle = `rgb(${shade+22},${shade+8},${shade-4})`;
      x.fillRect(px+1, py+1, S/8-2, rh-2);
      // 高光边
      x.fillStyle = `rgba(255,225,190,${0.05+Math.random()*0.07})`;
      x.fillRect(px+1, py+1, S/8-2, 1.5);
      // 阴影缝
      x.fillStyle = 'rgba(0,0,0,.35)';
      x.fillRect(px + S/8 - 2.5, py, 2.5, rh);
      x.fillRect(px, py + rh - 2.5, S/8, 2.5);
    }
  }
  const img = x.getImageData(0,0,S,S), d = img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*16; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(img,0,0);
  return c;
}

/* 石墙 */
function stoneCanvas(){
  const S = 256, { c, x } = cv(S);
  x.fillStyle = '#4b4a46'; x.fillRect(0,0,S,S);
  const rows = 8, rh = S/rows;
  for(let r=0;r<rows;r++){
    const off = (r%2)*(S/10);
    for(let i=-1;i<7;i++){
      const px = i*(S/5)+off + 1, py = r*rh + 1;
      const w = S/5 - 3, h = rh - 3;
      const sh = 52 + Math.random()*54;
      x.fillStyle = `rgb(${sh},${sh-2},${sh-8})`;
      x.beginPath();
      const rr2 = 5;
      x.moveTo(px+rr2,py);
      x.arcTo(px+w,py,px+w,py+h,rr2);
      x.arcTo(px+w,py+h,px,py+h,rr2);
      x.arcTo(px,py+h,px,py,rr2);
      x.arcTo(px,py,px+w,py,rr2);
      x.fill();
      x.fillStyle = `rgba(255,255,255,${0.03+Math.random()*0.05})`;
      x.fillRect(px,py,w,1.5);
    }
  }
  const img = x.getImageData(0,0,S,S), d = img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*30; d[i]+=n; d[i+1]+=n; d[i+2]+=n*0.6; }
  x.putImageData(img,0,0);
  return c;
}

const TEX = {
  grass : tex(noiseTex(512, '#54663a', 260, 1.0), 46, 46),
  grassN: tex(noiseTex(256, '#6b7d46', 180, 0.6), 30, 30),
  wood  : tex(woodCanvas(['#7d5730','#53381d']), 1, 1),
  woodD : tex(woodCanvas(['#5d3e22','#3a2615']), 1, 1),
  roof  : tex(shingleCanvas(), 1, 1),
  stone : tex(stoneCanvas(), 1, 1),
  bark  : tex(woodCanvas(['#5a4432','#33251a']), 1, 1),
  dirt  : tex(noiseTex(256, '#6b563c', 200, 0.8), 6, 6)
};
TEX.roof.repeat.set(1,1);

/* =========================================================================
   3. 天空穹顶 + 环境反射
   ========================================================================= */
const skyUniforms = {
  uTop:    { value: new THREE.Color(0x1e2a52) },
  uMid:    { value: new THREE.Color(0xd98a5f) },
  uBottom: { value: new THREE.Color(0xffb877) },
  uSunCol: { value: new THREE.Color(0xffd9a0) },
  uSunDir: { value: new THREE.Vector3(-0.85, 0.36, 0.40).normalize() },
  uStars:  { value: 0.0 },
  uTime:   { value: 0 },
  uSharp:  { value: 90.0 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: `
    varying vec3 vW;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uTop, uMid, uBottom, uSunCol, uSunDir;
    uniform float uStars, uTime, uSharp;
    varying vec3 vW;
    float hash31(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
    void main(){
      vec3 d = normalize(vW);
      float h = d.y * 0.5 + 0.5;
      vec3 col = mix(uBottom, uMid, smoothstep(0.42, 0.545, h));
      col = mix(col, uTop, smoothstep(0.52, 0.94, h));

      float sd = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunCol * pow(sd, uSharp) * 1.6;          // 日/月盘
      col += uSunCol * pow(sd, 7.0) * 0.30;            // 内晕
      col += uSunCol * pow(sd, 2.2) * 0.10;            // 外晕

      if(uStars > 0.001 && d.y > 0.0){
        vec3 p = d * 170.0;
        vec3 ce = floor(p), fp = fract(p) - 0.5;
        float hv = hash31(ce);
        float star = (1.0 - smoothstep(0.02, 0.30, length(fp))) * step(0.9915, hv);
        star *= 0.45 + 0.55 * sin(uTime * 1.9 + hv * 220.0);
        col += vec3(0.86, 0.92, 1.0) * star * uStars * smoothstep(0.02, 0.30, d.y) * 1.5;
      }
      // 抖动去色带
      col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453) - 0.5) / 190.0;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(320, 48, 32), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* 由天空生成环境贴图（让材质有环境反射） */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null;
const envScene = new THREE.Scene();
{
  const envSky = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 24), skyMat.clone());
  envSky.material.uniforms = skyUniforms;   // 与天空共享 uniform，随时间联动
  envScene.add(envSky);
}
function buildEnv(){
  if(envRT) envRT.dispose();
  envRT = pmrem.fromScene(envScene, 0.04, 1, 300);
  scene.environment = envRT.texture;
}
buildEnv();

/* =========================================================================
   4. 灯光
   ========================================================================= */
const hemi = new THREE.HemisphereLight(0x6f86b8, 0x2f3a22, 0.55);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x3a3550, 0.3);
scene.add(amb);

const sun = new THREE.DirectionalLight(0xffa95c, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW_END ? 1024 : 2048, LOW_END ? 1024 : 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 110;
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34;   sun.shadow.camera.bottom = -34;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.028;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 1, 0);

// 室内暖光（透过门窗）

interior.position.set(0, 1.5, 0);

const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.2, 0, 3.4),
  new THREE.Vector3(1.0, 0, 7.5),
  new THREE.Vector3(3.6, 0, 12.0),
  new THREE.Vector3(3.0, 0, 18.0),
  new THREE.Vector3(6.4, 0, 24.0),
  new THREE.Vector3(9.0, 0, 31.0),
  new THREE.Vector3(11.5, 0, 40.0)
]);
const PATH_PTS = pathCurve.getSpacedPoints(90);
function distToPath(x,z){
  let m = 1e9;
  for(let i=0;i<PATH_PTS.length;i++){
    const p = PATH_PTS[i];
    const dx = x - p.x, dz = z - p.z;
    const d = dx*dx + dz*dz;
    if(d < m) m = d;
  }
  return Math.sqrt(m);
}
function isPond(x,z){ return Math.hypot(x-POND.x, z-POND.y) < 8.2 && heightAt(x,z) < -0.35; }

const uTime = { value: 0 };
const uWind = { value: 1.0 };

function applyWind(mat, amount, freq, useInstanceOffset){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.uniforms.uWind = { value: amount };
    sh.uniforms.uFreq = { value: freq };
    sh.vertexShader = 'uniform float uTime;uniform float uWind;uniform float uFreq;\n' + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 iOff = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      #else
        vec3 iOff = vec3(0.0);
      #endif
      float ph = iOff.x * 0.42 + iOff.z * 0.31;
      float w1 = sin(uTime * uFreq + ph);
      float w2 = sin(uTime * uFreq * 2.17 + ph * 1.7);
      float gust = 0.62 + 0.38 * sin(uTime * 0.19 + iOff.x * 0.06);
      float amp = uWind * gust * max(transformed.y, 0.0);
      transformed.x += (w1 * 0.72 + w2 * 0.28) * amp;
      transformed.z += (w2 * 0.55 + w1 * 0.20) * amp;
    `);
  };
  mat.customProgramCacheKey = () => 'wind' + amount.toString() + '_' + freq.toString();
  return mat;
}

    for(const s of spots){ if(Math.hypot(s.x-x, s.z-z) < 3.0){ ok = false; break; } }
    if(!ok) continue;
    spots.push({ x, z, y: heightAt(x,z), s: rr(0.72, 1.5), kind: rand() });
  }
  return spots;
}

const cabin = new THREE.Group();
scene.add(cabin);

const HW = 3.35, HD = 2.75, LR = 0.175, LH = 0.30, ROWS = 11;

// 洞口（门窗）
const HOLES = {
  frontDoor: { axis:'x', side: 1, a: -0.62, b: 0.62, y0: 0.0,  y1: 2.12 },
  frontWin:  { axis:'x', side: 1, a:  1.35, b: 2.65, y0: 1.08, y1: 2.16 },
  backWin:   { axis:'x', side:-1, a: -2.55, b:-1.25, y0: 1.08, y1: 2.16 },
  sideWin:   { axis:'z', side:-1, a: -0.85, b: 0.85, y0: 1.12, y1: 2.16 }
};

function logSegments(axis, fixed, y, halfLen, holes){
  // axis 'x': 圆柱沿 X，位置 z=fixed ；axis 'z': 圆柱沿 Z，位置 x=fixed
  const out = [];
  const cuts = [];
  for(const k in holes){
    const h = holes[k];
    if(h.axis !== axis) continue;
    if(Math.abs(h.side * (axis==='x'? HD : HW) - fixed) > 0.6) continue;
    if(y + LR < h.y0 || y - LR > h.y1) continue;
    cuts.push([h.a, h.b]);
  }
  cuts.sort((p,q)=>p[0]-q[0]);
  let cursor = -halfLen;
  for(const [a,b] of cuts){
    if(a > cursor + 0.18) out.push([cursor, Math.min(a, halfLen)]);
    cursor = Math.max(cursor, b);
  }
  if(cursor < halfLen - 0.18) out.push([cursor, halfLen]);
  return out.filter(s => s[1] - s[0] > 0.18);
}

function makeLogCylinder(axis, fixed, y, x0, x1){
  const len = x1 - x0;
  const g = new THREE.CylinderGeometry(LR, LR, len, 9, 1);
  if(axis === 'x'){ g.rotateZ(Math.PI/2); g.translate((x0+x1)/2, y, fixed); }
  else { g.rotateX(Math.PI/2); g.translate(fixed, y, (x0+x1)/2); }
  // 顶部亮 / 底部暗（模拟层次与遮蔽）
  const p = g.attributes.position;
  const col = new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const yy = p.getY(i) - y;                     // -r..r
    const t = clamp((yy / LR) * 0.5 + 0.5, 0, 1);
    const v = 0.44 + Math.pow(t, 1.4) * 0.72;
    col[i*3]=v; col[i*3+1]=v*0.985; col[i*3+2]=v*0.95;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

const logGeos = [];
for(let i=0;i<ROWS;i++){
  const y = LR + i*LH;
  const even = (i % 2 === 0);
  if(even){
    // X 向（前后墙）在外
    [HD+LR, -(HD+LR)].forEach((fz, k) => {
      const holes = (k===0) ? { frontDoor: HOLES.frontDoor, frontWin: HOLES.frontWin } : { backWin: HOLES.backWin };
      logSegments('x', fz, y, HW + 0.34, holes).forEach(s => logGeos.push(makeLogCylinder('x', fz, y, s[0], s[1])));
    });
    [HW-LR, -(HW-LR)].forEach(fx => {
      const holes = (fx < 0) ? { sideWin: HOLES.sideWin } : {};   // 内墙同样开窗
      logSegments('z', fx, y, HD - 0.05, holes).forEach(s => logGeos.push(makeLogCylinder('z', fx, y, s[0], s[1])));
    });
  } else {
    [HD-LR, -(HD-LR)].forEach(fz => {
      const holes = (fz > 0) ? { frontDoor: HOLES.frontDoor, frontWin: HOLES.frontWin } : { backWin: HOLES.backWin };
      logSegments('x', fz, y, HW - 0.05, holes).forEach(s => logGeos.push(makeLogCylinder('x', fz, y, s[0], s[1])));
    });
    [HW+LR, -(HW+LR)].forEach(fx => {
      const holes = (fx < 0) ? { sideWin: HOLES.sideWin } : {};

function makeWindow(w, h, pos, rotY){
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ map: TEX.woodD, color: 0x7a5838, roughness: 0.9 });
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  g.add(gl);
  // 窗棂
  const barMat = new THREE.MeshStandardMaterial({ color: 0x5c4128, roughness: 0.9 });
  const bv = new THREE.Mesh(new THREE.BoxGeometry(0.045, h, 0.045), barMat);
  const bh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.045, 0.045), barMat);
  bv.position.z = 0.02; bh.position.z = 0.02;
  g.add(bv, bh);
  // 框
  const th = 0.09;
  const f1 = new THREE.Mesh(new THREE.BoxGeometry(w + th*2, th, 0.14), frameMat);
  const f2 = new THREE.Mesh(new THREE.BoxGeometry(th, h, 0.14), frameMat);
  const f3 = new THREE.Mesh(new THREE.BoxGeometry(th, h, 0.14), frameMat);
  f1.position.set(0, h/2 + th/2, 0.0);
  f2.position.set(-w/2 - th/2, 0, 0.0);
  f3.position.set( w/2 + th/2, 0, 0.0);
  const f4 = f1.clone(); f4.position.y = -h/2 - th/2;
  [f1,f2,f3,f4].forEach(m => { m.castShadow = true; g.add(m); });
  // 窗台 + 花箱
  const sill = new THREE.Mesh(new THREE.BoxGeometry(w + 0.36, 0.09, 0.26), frameMat);
  sill.position.set(0, -h/2 - 0.12, 0.08);
  sill.castShadow = true;
  g.add(sill);
  const box = new THREE.Mesh(new THREE.BoxGeometry(w + 0.18, 0.26, 0.2), new THREE.MeshStandardMaterial({
    map: TEX.woodD, color: 0x6b4d31, roughness: 0.92
  }));
  box.position.set(0, -h/2 + 0.06, 0.11);
  box.castShadow = true;
  g.add(box);
  // 花
  const flowerCols = [0xd4657a, 0xe0a04a, 0xc9d6e8];
  for(let i=0;i<7;i++){
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.075, 7, 6),
      new THREE.MeshStandardMaterial({ color: flowerCols[i % 3], roughness: 0.85 }));
    f.position.set(rr(-w/2, w/2)*0.92, -h/2 + 0.23 + rr(0, 0.05), rr(0.05, 0.17));
    g.add(f);
  }
  // 绿叶
  for(let i=0;i<8;i++){
    const lf = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0x3f6330, roughness: 0.9, flatShading: true }));
    lf.scale.set(1, 0.5, 1.6);
    lf.position.set(rr(-w/2, w/2)*0.94, -h/2 + 0.19, rr(0.02, 0.19));
    lf.rotation.y = rand()*3;
    g.add(lf);
  }
  g.position.copy(pos);
  g.rotation.y = rotY;
  cabin.add(g);
  return g;
}

function softPoint(){
  const S = 64, { c, x } = cv(S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,.45)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

};
const smoke = (() => {
  const N = 90;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), seed = new Float32Array(N), spd = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3] = chimneyTop.x + rr(-0.16,0.16);
    pos[i*3+1] = chimneyTop.y;
    pos[i*3+2] = chimneyTop.z + rr(-0.16,0.16);
    seed[i] = rand(); spd[i] = rr(0.75, 1.3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(spd,1));
  const m = new THREE.ShaderMaterial({
    uniforms: smokeUniforms, transparent:true, depthWrite:false,
    blending: THREE.NormalBlending,
    vertexShader: `
      attribute float aSeed; attribute float aSpeed;
      uniform float uTime; varying float vA;
      void main(){
        float life = fract(uTime * 0.075 * aSpeed + aSeed);
        vec3 p = position;
        float rise = life * 7.5;
        p.y += rise;
        float drift = life*life;
        p.x += sin(aSeed*31.0 + life*3.2) * drift * 2.1 + life * 1.4;
        p.z += cos(aSeed*17.0 + life*2.6) * drift * 1.7;
        vA = smoothstep(0.0, 0.10, life) * (1.0 - smoothstep(0.25, 1.0, life));
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = (36.0 + life * 150.0) * (18.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uMap; uniform float uOpacity; uniform vec3 uColor;
      varying float vA;
      void main(){
        float a = texture2D(uMap, gl_PointCoord).a;
        gl_FragColor = vec4(uColor, a * vA * 0.24 * uOpacity);
      }`
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
})();

    uVignette: { value: 0.85 }, uGrain: { value: 0.055 },
    uSat: { value: 1.10 }, uContrast: { value: 1.06 },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uTint: { value: new THREE.Color(0xffe9d0) }, uTintAmt: { value: 0.06 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uSat, uContrast, uTintAmt;
    uniform vec2 uRes; uniform vec3 uTint;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float r2 = dot(c,c);
      float ca = 0.0022 * r2 * 3.0;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + c*ca).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - c*ca).b;

      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uContrast + 0.5;
      col = mix(col, col * uTint, uTintAmt);

      float v = 1.0 - smoothstep(0.28, 1.05, length(c) * 1.28);
      col *= mix(1.0, v, uVignette);

      float g = fract(sin(dot(vUv*uRes + uTime*57.0, vec2(12.9898,78.233))) * 43758.5453);
      col += (g - 0.5) * uGrain;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`
};

const cur = {};
function initCur(p){
  cur.sunCol = new THREE.Color(p.sunCol);
  cur.sunDir = new THREE.Vector3().fromArray(p.sunDir).normalize();
  cur.sunI = p.sunI;
  cur.hemiSky = new THREE.Color(p.hemiSky);
  cur.hemiGnd = new THREE.Color(p.hemiGnd);
  cur.hemiI = p.hemiI;

  cur.skyMid = new THREE.Color(p.skyMid);

  cur.tint = new THREE.Color(p.tint);
  Object.assign(cur, {
    fogD: p.fogD, stars: p.stars, sharp: p.sharp,
    win: p.win, lantern: p.lantern, interior: p.interior, smoke: p.smoke, dust: p.dust, fly: p.fly,
    bloom: p.bloom, bloomT: p.bloomT, exposure: p.exposure, ray: p.ray,
    tintAmt: p.tintAmt, sat: p.sat, contrast: p.contrast, vign: p.vign, grain: p.grain
  });
}
let tgt = null, envRefresh = 2;
function setPreset(name){ tgt = { ...PRESETS[name] }; envRefresh = 7; }
initCur(PRESETS.dusk);
tgt = { ...PRESETS.dusk };

function stepPreset(dt){
  const k = 1 - Math.pow(0.001, dt * 0.55);
  cur.sunCol.lerp(new THREE.Color(tgt.sunCol), k);
  cur.sunDir.lerp(new THREE.Vector3().fromArray(tgt.sunDir).normalize(), k).normalize();
  cur.hemiSky.lerp(new THREE.Color(tgt.hemiSky), k);
  cur.hemiGnd.lerp(new THREE.Color(tgt.hemiGnd), k);
  cur.ambCol.lerp(new THREE.Color(tgt.ambCol), k);
  cur.skyTop.lerp(new THREE.Color(tgt.skyTop), k);
  cur.skyMid.lerp(new THREE.Color(tgt.skyMid), k);
  cur.skyBot.lerp(new THREE.Color(tgt.skyBot), k);
  cur.sunDisc.lerp(new THREE.Color(tgt.sunDisc), k);
  cur.fogCol.lerp(new THREE.Color(tgt.fogCol), k);
  cur.tint.lerp(new THREE.Color(tgt.tint), k);
  ['sunI','hemiI','ambI','fogD','stars','sharp','win','lantern','interior','smoke','dust','fly',
   'bloom','bloomT','exposure','ray','tintAmt','sat','contrast','vign','grain'].forEach(key => {
    cur[key] = lerp(cur[key], tgt[key], k);
  });

  sun.color.copy(cur.sunCol);
  sun.intensity = cur.sunI;
  sun.position.copy(cur.sunDir).multiplyScalar(46).add(sun.target.position);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity = cur.hemiI;
  amb.color.copy(cur.ambCol); amb.intensity = cur.ambI;
  scene.fog.color.copy(cur.fogCol); scene.fog.density = cur.fogD;
  interior.intensity = cur.interior;
  lanternLight.intensity = cur.lantern;

  skyUniforms.uTop.value.copy(cur.skyTop);
  skyUniforms.uMid.value.copy(cur.skyMid);
  skyUniforms.uBottom.value.copy(cur.skyBot);
  skyUniforms.uSunCol.value.copy(cur.sunDisc);
  skyUniforms.uSunDir.value.copy(cur.sunDir);
  skyUniforms.uStars.value = cur.stars;
  skyUniforms.uSharp.value = cur.sharp;

  glassMat.emissiveIntensity = cur.win;
  if(lanternBulb) lanternBulb.material.emissiveIntensity = cur.win * 1.5;
  smokeUniforms.uOpacity.value = cur.smoke;
  dustUniforms.uOpacity.value = cur.dust;
  flyUniforms.uOpacity.value = cur.fly;
  if(rayMatRef) rayMatRef.uniforms.uOpacity.value = cur.ray;
  if(rayMatRef) rayMatRef.uniforms.uColor.value.copy(cur.sunDisc);
  smokeUniforms.uColor.value.copy(cur.sunDisc).lerp(new THREE.Color(0xffffff), 0.55);

  bloom.strength = cur.bloom;
  bloom.threshold = cur.bloomT;
  renderer.toneMappingExposure = cur.exposure;
  grade.uniforms.uSat.value = cur.sat;
  grade.uniforms.uContrast.value = cur.contrast;
  grade.uniforms.uVignette.value = cur.vign;
  grade.uniforms.uGrain.value = cur.grain;
  grade.uniforms.uTint.value.copy(cur.tint);
  grade.uniforms.uTintAmt.value = cur.tintAmt;
}

/* =========================================================================
   13. UI
   ========================================================================= */
const seg = document.getElementById('seg-time');
seg.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    setPreset(b.dataset.p);
  });
});
const tgOrbit = document.getElementById('tg-orbit');
tgOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  tgOrbit.classList.toggle('on', controls.autoRotate);
});

// 交互后短暂停止自动环绕
let idleTimer = null;
controls.addEventListener('start', () => {
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(controls.autoRotate){ controls.autoRotate = false; tgOrbit.classList.remove('on'); }
});

/* =========================================================================
   14. 主循环
   ========================================================================= */
const clock = new THREE.Clock();
let tAcc = 0, envTimer = 0, frames = 0, lastBreath = 0;

function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  grade.uniforms.uRes.value.set(w, h);
}
addEventListener('resize', onResize);

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.06);
  tAcc += dt;
  uTime.value = tAcc;

  stepPreset(dt);
  skyUniforms.uTime.value = tAcc;

  // 相机极低幅度呼吸（增量方式，避免累积漂移）
  const breath = Math.sin(tAcc * 0.31) * 0.055 + Math.sin(tAcc * 0.17) * 0.032;
  camera.position.y += (breath - lastBreath);
  lastBreath = breath;

  // 体积光跟随太阳方位
  if(rayMatRef){
    const az = Math.atan2(cur.sunDir.x, cur.sunDir.z);
    godRays.rotation.y = az;
    const tilt = Math.atan2(Math.hypot(cur.sunDir.x, cur.sunDir.z), cur.sunDir.y);
    godRays.children.forEach(m => { m.rotation.z = -tilt * 0.42; });
  }

  controls.update();
  composer.render();

  // 天空变化后重建环境反射贴图
  envTimer += dt;
  if(envTimer > 1.25 && envRefresh > 0){ envTimer = 0; envRefresh--; buildEnv(); }
  frames++;

  if(frames === 3){
    const ld = document.getElementById('loading');
    if(ld) ld.classList.add('hide');
  }
}
onResize();
tick();

// 允许外部调试
window.__scene = scene;
window.__camera = camera;
</script>

<script>
(function(){
  const CANDIDATES = [
    'https://unpkg.com/three@0.160.0/',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/',
    'https://esm.sh/three@0.160.0/'
  ];
  const bar = document.getElementById('lgbar');
  const err = document.getElementById('lerr');
  function fail(msg){
    err.style.display = 'block';
    err.textContent = msg;
    if(bar) bar.style.width = '100%';
  }
  function boot(base){
    const im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({
      imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' }
    });
    document.head.appendChild(im);
    const src = document.getElementById('main-src').textContent;
    const blob = new Blob([src], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    import(url).catch(e => {
      console.error(e);
      fail('场景加载失败：' + (e && e.message ? e.message : e) + ' — 请检查网络后刷新重试。');
    });
  }
  let idx = 0;
  function tryNext(){
    if(idx >= CANDIDATES.length){ boot(CANDIDATES[0]); return; }
    const base = CANDIDATES[idx++];
    const t = setTimeout(() => tryNext(), 4500);
    fetch(base + 'build/three.module.js', { method:'GET', cache:'force-cache' })
      .then(r => { if(!r.ok) throw new Error('bad'); clearTimeout(t); boot(base); })
      .catch(() => { clearTimeout(t); tryNext(); });
  }
  tryNext();
})();
</script>
