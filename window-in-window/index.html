<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窗口中的窗口</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: #1a1a2e; height: 100vh; overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}
.desktop {
  width: 100vw; height: 100vh; position: relative;
  background: radial-gradient(ellipse at center, #16213e 0%, #0f0f23 100%);
  overflow: hidden;
}
/* 壁纸图标 */
.icon-row {
  position: absolute; bottom: 70px; left: 20px; display: flex; gap: 16px;
}
.desktop-icon {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 12px; cursor: pointer; border-radius: 6px; width: 72px;
  color: #fff; font-size: 11px; text-align: center; transition: background 0.15s;
}
.desktop-icon:hover { background: rgba(255,255,255,0.1); }
.desktop-icon svg { width: 36px; height: 36px; opacity: 0.85; }

/* 窗口样式 */
.window {
  position: absolute; min-width: 250px; min-height: 150px;
  background: rgba(30, 30, 50, 0.92);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
  display: flex; flex-direction: column;
  transition: box-shadow 0.2s, opacity 0.2s, transform 0.2s;
}
.window.active {
  box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,102,241,0.3) inset;
  z-index: 100;
}
.window.minimized {
  transform: scale(0.8); opacity: 0; pointer-events: none;
}
.title-bar {
  display: flex; align-items: center; padding: 0 10px; height: 36px;
  cursor: move; flex-shrink: 0;
  border-radius: 10px 10px 0 0;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.title-bar .title {
  flex: 1; font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 0.3px;
  display: flex; align-items: center; gap: 6px;
}
.title-bar .title .dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.title-btns { display: flex; gap: 6px; }
.title-btns span {
  width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
  transition: filter 0.15s;
}
.title-btns span:hover { filter: brightness(1.3); }
.btn-close { background: #ff5f57; }
.btn-min { background: #fdbc40; }
.btn-max { background: #33c748; }
.window-body {
  flex: 1; padding: 16px; overflow: auto; color: rgba(255,255,255,0.85);
  font-size: 13px; line-height: 1.6; position: relative;
}
.window-body::-webkit-scrollbar { width: 4px; }
.window-body::-webkit-scrollbar-track { background: transparent; }
.window-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

/* 嵌套窗口（窗口中的窗口） */
.nested-window {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; background: rgba(0,0,0,0.25); overflow: hidden;
  margin-top: 8px;
}
.nested-title {
  display: flex; align-items: center; padding: 6px 10px;
  background: rgba(255,255,255,0.04); font-size: 11px; color: rgba(255,255,255,0.5);
  gap: 6px; cursor: move;
}
.nested-body { padding: 10px; font-size: 12px; }

/* 任务栏 */
.taskbar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
  background: rgba(20, 20, 35, 0.85); backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; padding: 0 12px; gap: 4px;
  z-index: 999;
}
.taskbar-item {
  padding: 4px 14px; border-radius: 4px; font-size: 11px; color: rgba(255,255,255,0.5);
  cursor: pointer; transition: background 0.15s, color 0.15s;
  border: 1px solid transparent;
}
.taskbar-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
.taskbar-item.active { background: rgba(99,102,241,0.2); color: #818cf8; border-color: rgba(99,102,241,0.3); }
.taskbar-start {
  padding: 4px 10px; border-radius: 4px; color: #818cf8; font-size: 14px;
  cursor: pointer; margin-right: 8px; font-weight: bold;
}
.taskbar-start:hover { background: rgba(255,255,255,0.06); }
.taskbar-right {
  margin-left: auto; display: flex; align-items: center; gap: 12px;
  color: rgba(255,255,255,0.4); font-size: 11px;
}

/* 调整大小手柄 */
.resize-handle {
  position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
  cursor: nwse-resize;
}
.resize-handle::after {
  content: ''; position: absolute; right: 3px; bottom: 3px;
  width: 6px; height: 6px;
  border-right: 2px solid rgba(255,255,255,0.2);
  border-bottom: 2px solid rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<div class="desktop" id="desktop">

  <!-- 壁纸图标 -->
  <div class="icon-row">
    <div class="desktop-icon" onclick="createWindow('记事本', notepadContent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>
      <span>记事本</span>
    </div>
    <div class="desktop-icon" onclick="createWindow('嵌套演示', nestedContent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f0abfc" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      <span>嵌套演示</span>
    </div>
    <div class="desktop-icon" onclick="createWindow('关于', aboutContent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#86efac" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>关于</span>
    </div>
  </div>

  <!-- 任务栏 -->
  <div class="taskbar" id="taskbar">
    <div class="taskbar-start">❖</div>
    <div id="taskbarItems"></div>
    <div class="taskbar-right">
      <span id="clock">00:00</span>
    </div>
  </div>
</div>

<script>
// --- 窗口管理器 ---
let windows = [];
let zIndexCounter = 100;
let dragTarget = null, dragOffsetX, dragOffsetY;
let resizeTarget = null, resizeStartX, resizeStartY, resizeStartW, resizeStartH;

// 窗口内容模板
const notepadContent = `
  <div style="margin-bottom:10px;font-weight:500;color:rgba(255,255,255,0.6);font-size:11px;letter-spacing:0.5px">📄 未命名文档</div>
  <textarea style="width:100%;height:120px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:4px;color:#e2e8f0;padding:8px;font-size:12px;resize:none;outline:none;font-family:inherit" placeholder="在此输入文字..."></textarea>
`;

const nestedContent = `
  <div style="font-size:12px;margin-bottom:10px;color:rgba(255,255,255,0.5)">下面是一个嵌套在父窗口中的子窗口：</div>
  <div class="nested-window" id="nestedWin">
    <div class="nested-title" id="nestedTitle">
      <span style="color:#f0abfc">⊞</span>
      <span style="flex:1">子窗口</span>
      <span style="cursor:pointer;color:rgba(255,255,255,0.3)" onclick="this.parentElement.parentElement.remove()">✕</span>
    </div>
    <div class="nested-body">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input type="text" value="这是嵌套的内容" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:4px 8px;color:#e2e8f0;font-size:12px;outline:none">
      </div>
      <div style="display:flex;gap:6px">
        <button style="background:#818cf8;border:none;padding:4px 12px;border-radius:4px;color:#fff;font-size:11px;cursor:pointer">确定</button>
        <button style="background:rgba(255,255,255,0.06);border:none;padding:4px 12px;border-radius:4px;color:rgba(255,255,255,0.5);font-size:11px;cursor:pointer">取消</button>
      </div>
    </div>
  </div>
  <div style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.3)">
    提示：可以拖拽父窗口移动，子窗口固定在父窗口内部。
  </div>
`;

const aboutContent = `
  <div style="text-align:center;padding:8px 0">
    <div style="font-size:28px;margin-bottom:8px">🪟</div>
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">窗口中的窗口</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.4)">纯前端实现 · 无需任何依赖</div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);font-size:11px;color:rgba(255,255,255,0.3)">
      双击壁纸图标创建新窗口<br>
      拖拽标题栏移动 · 右下角调整大小
    </div>
  </div>
`;

function createWindow(title, content) {
  const desktop = document.getElementById('desktop');
  const w = document.createElement('div');
  w.className = 'window active';
  const id = 'win_' + Date.now();
  w.id = id;

  const baseW = 340 + Math.random() * 100;
  const baseH = 230 + Math.random() * 80;
  const maxX = desktop.clientWidth - baseW - 20;
  const maxY = desktop.clientHeight - baseH - 60;

  w.style.cssText = `
    width:${baseW}px; height:${baseH}px;
    left:${40 + Math.random() * maxX * 0.5}px;
    top:${30 + Math.random() * maxY * 0.5}px;
    z-index:${++zIndexCounter};
  `;

  w.innerHTML = `
    <div class="title-bar">
      <div class="title">
        <span class="dot" style="background:${['#818cf8','#f0abfc','#86efac','#fbbf24','#f87171'][Math.floor(Math.random()*5)]}"></span>
        ${title}
      </div>
      <div class="title-btns">
        <span class="btn-min" onclick="minimizeWindow('${id}')"></span>
        <span class="btn-max" onclick="toggleMaximize('${id}')"></span>
        <span class="btn-close" onclick="closeWindow('${id}')"></span>
      </div>
    </div>
    <div class="window-body">${content}</div>
    <div class="resize-handle"></div>
  `;

  desktop.insertBefore(w, desktop.querySelector('.taskbar'));

  // 点击激活
  w.addEventListener('mousedown', () => activateWindow(id));

  // 拖拽
  const titleBar = w.querySelector('.title-bar');
  titleBar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.title-btns')) return;
    activateWindow(id);
    dragTarget = w;
    dragOffsetX = e.clientX - w.offsetLeft;
    dragOffsetY = e.clientY - w.offsetTop;
    e.preventDefault();
  });

  // 调整大小
  const handle = w.querySelector('.resize-handle');
  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    activateWindow(id);
    resizeTarget = w;
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    resizeStartW = w.offsetWidth;
    resizeStartH = w.offsetHeight;
    e.preventDefault();
  });

  windows.push({ id, el: w, title, minimized: false });
  updateTaskbar();
  return w;
}

function activateWindow(id) {
  const win = windows.find(w => w.id === id);
  if (!win) return;
  win.el.style.zIndex = ++zIndexCounter;
  win.el.classList.add('active');
  windows.forEach(w => {
    if (w.id !== id) w.el.classList.remove('active');
  });
  updateTaskbar();
}

function closeWindow(id) {
  const idx = windows.findIndex(w => w.id === id);
  if (idx === -1) return;
  windows[idx].el.remove();
  windows.splice(idx, 1);
  updateTaskbar();
}

function minimizeWindow(id) {
  const win = windows.find(w => w.id === id);
  if (!win) return;
  win.minimized = !win.minimized;
  win.el.classList.toggle('minimized');
  updateTaskbar();
}

function toggleMaximize(id) {
  const win = windows.find(w => w.id === id);
  if (!win) return;
  const el = win.el;
  if (el.dataset.maximized === 'true') {
    el.style.left = el.dataset.oldLeft;
    el.style.top = el.dataset.oldTop;
    el.style.width = el.dataset.oldW;
    el.style.height = el.dataset.oldH;
    el.dataset.maximized = 'false';
  } else {
    el.dataset.oldLeft = el.style.left;
    el.dataset.oldTop = el.style.top;
    el.dataset.oldW = el.style.width;
    el.dataset.oldH = el.style.height;
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = (document.getElementById('desktop').clientWidth) + 'px';
    el.style.height = (document.getElementById('desktop').clientHeight - 44) + 'px';
    el.dataset.maximized = 'true';
  }
}

function updateTaskbar() {
  const container = document.getElementById('taskbarItems');
  container.innerHTML = '';
  windows.forEach(w => {
    const item = document.createElement('div');
    item.className = 'taskbar-item' + (w.el.classList.contains('active') ? ' active' : '') + (w.minimized ? ' minimized' : '');
    item.textContent = w.title;
    item.onclick = () => {
      if (w.minimized) {
        w.minimized = false;
        w.el.classList.remove('minimized');
      }
      activateWindow(w.id);
    };
    container.appendChild(item);
  });
}

// 全局鼠标事件
document.addEventListener('mousemove', (e) => {
  if (dragTarget) {
    const desktop = document.getElementById('desktop');
    let x = e.clientX - dragOffsetX;
    let y = e.clientY - dragOffsetY;
    x = Math.max(0, Math.min(x, desktop.clientWidth - dragTarget.offsetWidth));
    y = Math.max(0, Math.min(y, desktop.clientHeight - dragTarget.offsetHeight - 44));
    dragTarget.style.left = x + 'px';
    dragTarget.style.top = y + 'px';
  }
  if (resizeTarget) {
    const dx = e.clientX - resizeStartX;
    const dy = e.clientY - resizeStartY;
    const newW = Math.max(250, resizeStartW + dx);
    const newH = Math.max(150, resizeStartH + dy);
    resizeTarget.style.width = newW + 'px';
    resizeTarget.style.height = newH + 'px';
  }
});

document.addEventListener('mouseup', () => {
  dragTarget = null;
  resizeTarget = null;
});

// 嵌套窗口拖拽（在父窗口内部移动）
document.addEventListener('mousedown', (e) => {
  const nestedTitle = e.target.closest('#nestedTitle');
  if (!nestedTitle) return;
  const nestedWin = nestedTitle.closest('.nested-window');
  if (!nestedWin) return;
  const parentBody = nestedWin.closest('.window-body');
  if (!parentBody) return;

  const startX = e.clientX;
  const startY = e.clientY;
  const origLeft = nestedWin.offsetLeft;
  const origTop = nestedWin.offsetTop;

  function onMove(ev) {
    let dx = ev.clientX - startX;
    let dy = ev.clientY - startY;
    const maxX = parentBody.clientWidth - nestedWin.offsetWidth;
    const maxY = parentBody.clientHeight - nestedWin.offsetHeight;
    let nx = Math.max(0, Math.min(maxX, origLeft + dx));
    let ny = Math.max(0, Math.min(maxY, origTop + dy));
    nestedWin.style.position = 'relative';
    nestedWin.style.left = nx + 'px';
    nestedWin.style.top = ny + 'px';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
});

// 时钟
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateClock();
setInterval(updateClock, 30000);

// 启动时创建默认窗口
window.onload = () => {
  setTimeout(() => {
    createWindow('嵌套演示', nestedContent);
    setTimeout(() => {
      createWindow('记事本', notepadContent);
    }, 200);
    setTimeout(() => {
      createWindow('关于', aboutContent);
    }, 400);
  }, 300);
};
</script>
</body>
</html>
