<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>时间戳工具</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --sub:#9aa0a6;
  --accent:#4c8dff; --warn:#ff9f43; --ok:#28c76f; --err:#ff6b6b;
  --line:#2a2f3a; --input:#0b0d11;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:16px;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  display:flex;flex-direction:column;gap:14px;min-height:100vh;
  padding-bottom:40px;max-width:560px;margin:0 auto;width:100%;
}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0;text-align:center;letter-spacing:2px}
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card-title{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
label{font-size:14px;color:var(--sub)}
input[type=text],textarea,select,input[type=datetime-local]{
  background:var(--input);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit;width:100%;
  font-variant-numeric:tabular-nums;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.big{
  font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:center;padding:8px 0;letter-spacing:.5px;word-break:break-all;
}
.big.sec{font-size:20px;color:var(--sub)}
.out{display:flex;flex-direction:column;gap:6px}
.out-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--input);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
}
.out-row .k{font-size:12px;color:var(--sub);flex:0 0 auto}
.out-row .v{font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all;cursor:pointer}
.out-row .v:hover{color:var(--accent)}
.err{color:var(--err);font-size:13px;text-align:center;min-height:18px}
.ok{color:var(--ok)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{
  flex:1;min-width:88px;padding:12px;border:0;border-radius:11px;font-size:14px;font-weight:700;
  color:#fff;background:var(--accent);cursor:pointer;transition:.15s;font-family:inherit;
}
.btns button:active{transform:scale(.96)}
.btns button.ghost{background:var(--line);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--input);
  color:var(--sub);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;
}
.chips button:hover{border-color:var(--accent);color:var(--fg)}
.hint{font-size:12px;color:#6b7280;line-height:1.7}
.diff{font-size:30px;font-weight:700;text-align:center;color:var(--warn);font-variant-numeric:tabular-nums}
.diff-sub{text-align:center;font-size:13px;color:var(--sub)}
</style>
</head>
<body>

<h1>时 间 戳 工 具</h1>

<!-- 当前时间戳 -->
<div class="card">
  <div class="card-title">当前时间戳</div>
  <div class="big" id="nowMs" title="点击复制">--</div>
  <div class="big sec" id="nowSec" title="点击复制">--</div>
  <div class="row">
    <label style="font-size:12.5px" id="nowDate">--</label>
    <div class="btns" style="flex:0 0 auto;gap:8px">
      <button style="min-width:70px;padding:9px" data-copy="__nowMs">复制毫秒</button>
      <button style="min-width:70px;padding:9px" class="ghost" data-copy="__nowSec">复制秒</button>
    </div>
  </div>
</div>

<!-- 时间戳 → 时间 -->
<div class="card">
  <div class="card-title">时间戳 → 时间</div>
  <input type="text" id="tsInput" placeholder="输入 10 位秒 / 13 位毫秒时间戳" inputmode="numeric">
  <div class="err" id="tsErr"></div>
  <div class="out" id="tsOut">
    <div class="out-row"><span class="k">本地时间</span><span class="v" data-copy-out>--</span></div>
    <div class="out-row"><span class="k">ISO 8601</span><span class="v" data-copy-out>--</span></div>
    <div class="out-row"><span class="k">UTC</span><span class="v" data-copy-out>--</span></div>
    <div class="out-row"><span class="k">Date 语法</span><span class="v" data-copy-out>--</span></div>
    <div class="out-row"><span class="k">相对</span><span class="v" data-copy-out>--</span></div>
  </div>
</div>

<!-- 时间 → 时间戳 -->
<div class="card">
  <div class="card-title">时间 → 时间戳</div>
  <input type="datetime-local" id="dtInput" step="1">
  <div class="chips">
    <button id="btnNow">现在</button>
    <button id="btnToday">今天 0 点</button>
    <button id="btnTomorrow">明天 0 点</button>
    <button id="btnLastWeek">7 天前</button>
  </div>
  <div class="out">
    <div class="out-row"><span class="k">毫秒</span><span class="v" id="dtMs" data-copy-out>--</span></div>
    <div class="out-row"><span class="k">秒</span><span class="v" id="dtSec" data-copy-out>--</span></div>
  </div>
</div>

<!-- 差值 / 倒计时 -->
<div class="card">
  <div class="card-title">倒计时 / 已过去</div>
  <input type="datetime-local" id="cdInput" step="1">
  <div class="diff" id="cdDiff">--</div>
  <div class="diff-sub" id="cdSub">选择一个目标时间，实时显示与它的差值</div>
</div>

<div class="hint">
· 点任意数值即可复制；10 位按「秒」、13 位按「毫秒」自动识别，11–12 位按毫秒处理。<br>
· 所有换算基于你当前设备时区；「UTC」行是国际标准时间，可直接用于接口调试。
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var el = {
    nowMs: $('nowMs'), nowSec: $('nowSec'), nowDate: $('nowDate'),
    tsInput: $('tsInput'), tsErr: $('tsErr'), tsOut: $('tsOut'),
    dtInput: $('dtInput'), dtMs: $('dtMs'), dtSec: $('dtSec'),
    cdInput: $('cdInput'), cdDiff: $('cdDiff'), cdSub: $('cdSub')
  };

  // ---------- 复制 ----------
  function copy(text){
    var done = function(){ flash('已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
  var flashTimer = null;
  function flash(msg){
    el.nowDate.textContent = msg; el.nowDate.className = 'ok';
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){
      el.nowDate.className = ''; tickNow();
    }, 1200);
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-copy')){
      var k = t.getAttribute('data-copy');
      if (k === '__nowMs') copy(String(Date.now()));
      else if (k === '__nowSec') copy(String(Math.floor(Date.now() / 1000)));
    } else if (t.hasAttribute && t.hasAttribute('data-copy-out') && t.textContent !== '--'){
      copy(t.textContent);
    }
  });

  // ---------- 时间格式化 ----------
  function pad(n){ return String(n).padStart(2, '0'); }
  function fmtLocal(d){
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
           '.' + String(d.getMilliseconds()).padStart(3, '0') +
           '（UTC' + (d.getTimezoneOffset() <= 0 ? '+' : '−') + pad(Math.floor(Math.abs(d.getTimezoneOffset())/60)) +
           (Math.abs(d.getTimezoneOffset())%60 ? ':' + pad(Math.abs(d.getTimezoneOffset())%60) : '') + '）';
  }
  function rel(d, now){
    var diff = d.getTime() - now;
    var past = diff < 0; diff = Math.abs(diff);
    var sec = Math.floor(diff / 1000);
    var days = Math.floor(sec / 86400), hours = Math.floor(sec % 86400 / 3600),
        mins = Math.floor(sec % 3600 / 60), s = sec % 60;
    var p = [];
    if (days) p.push(days + ' 天');
    if (hours) p.push(hours + ' 小时');
    if (mins) p.push(mins + ' 分');
    if (s || !p.length) p.push(s + ' 秒');
    return (past ? '过去 ' : '还有 ') + p.join(' ');
  }

  // ---------- 当前时间戳 ----------
  function tickNow(){
    var ms = Date.now();
    el.nowMs.textContent = ms;
    el.nowSec.textContent = Math.floor(ms / 1000);
    if (!el.nowDate.classList.contains('ok')){
      el.nowDate.textContent = fmtLocal(new Date(ms));
    }
    updateCountdown(ms);
  }
  setInterval(tickNow, 200);

  // ---------- 时间戳 → 时间 ----------
  function parseTs(raw){
    raw = raw.trim();
    if (!raw) return null;
    if (!/^-?\d+$/.test(raw)) return { err: '只接受整数时间戳' };
    var n = parseInt(raw, 10);
    var abs = Math.abs(n);
    var ms;
    if (raw.replace('-','').length <= 10) ms = n * 1000;       // 秒
    else if (raw.replace('-','').length >= 13) ms = n;          // 毫秒
    else ms = n;                                                // 11–12 位按毫秒
    var d = new Date(ms);
    if (isNaN(d.getTime())) return { err: '数值超出日期范围' };
    return { ms: ms, d: d };
  }
  function renderTs(){
    var r = parseTs(el.tsInput.value);
    var vals = el.tsOut.querySelectorAll('.v');
    if (!r){
      vals.forEach(function(v){ v.textContent = '--'; });
      el.tsErr.textContent = '';
      return;
    }
    if (r.err){ el.tsErr.textContent = r.err; return; }
    el.tsErr.textContent = '';
    vals[0].textContent = fmtLocal(r.d);
    vals[1].textContent = r.d.toISOString();
    vals[2].textContent = r.d.toUTCString();
    vals[3].textContent = 'new Date(' + r.ms + ')';
    vals[4].textContent = rel(r.d, Date.now());
  }
  el.tsInput.addEventListener('input', renderTs);

  // ---------- 时间 → 时间戳 ----------
  function toLocalInput(d){
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function renderDt(){
    var v = el.dtInput.value;
    if (!v){ el.dtMs.textContent = '--'; el.dtSec.textContent = '--'; return; }
    var d = new Date(v);
    if (isNaN(d.getTime())){ el.dtMs.textContent = '无效时间'; el.dtSec.textContent = '--'; return; }
    el.dtMs.textContent = d.getTime();
    el.dtSec.textContent = Math.floor(d.getTime() / 1000);
  }
  el.dtInput.addEventListener('input', renderDt);
  $('btnNow').addEventListener('click', function(){ el.dtInput.value = toLocalInput(new Date()); renderDt(); });
  $('btnToday').addEventListener('click', function(){
    var d = new Date(); d.setHours(0,0,0,0); el.dtInput.value = toLocalInput(d); renderDt();
  });
  $('btnTomorrow').addEventListener('click', function(){
    var d = new Date(); d.setDate(d.getDate()+1); d.setHours(0,0,0,0); el.dtInput.value = toLocalInput(d); renderDt();
  });
  $('btnLastWeek').addEventListener('click', function(){
    var d = new Date(); d.setDate(d.getDate()-7); el.dtInput.value = toLocalInput(d); renderDt();
  });

  // ---------- 倒计时 ----------
  function updateCountdown(nowMs){
    var v = el.cdInput.value;
    if (!v){ el.cdDiff.textContent = '--'; el.cdSub.textContent = '选择一个目标时间，实时显示与它的差值'; return; }
    var target = new Date(v).getTime();
    if (isNaN(target)){ el.cdDiff.textContent = '无效时间'; return; }
    var diff = target - nowMs;
    var past = diff < 0; diff = Math.abs(diff);
    var sec = Math.floor(diff / 1000);
    var days = Math.floor(sec / 86400), hours = Math.floor(sec % 86400 / 3600),
        mins = Math.floor(sec % 3600 / 60), s = sec % 60;
    el.cdDiff.textContent = (past ? '已过去 ' : '还有 ') +
      (days ? days + ' 天 ' : '') + pad(hours) + ':' + pad(mins) + ':' + pad(s);
    el.cdSub.textContent = (past ? '目标时间已过 · ' : '目标时间：') + fmtLocal(new Date(target));
  }
  el.cdInput.addEventListener('input', function(){ updateCountdown(Date.now()); });

  // 初始化
  el.dtInput.value = toLocalInput(new Date());
  renderDt(); renderTs(); tickNow();
})();
</script>

</body>
</html>
