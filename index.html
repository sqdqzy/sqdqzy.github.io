<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神奇的乔治亚 · 项目索引</title>
  <meta name="description" content="神奇的乔治亚的 HTML 项目索引页，点击即可快速使用">
  <style>
    /* ===== 主题变量：浅色模式 ===== */
    :root {
      --bg: #f5f6fa;
      --bg-card: #ffffff;
      --text: #1f2430;
      --text-sub: #5c6370;
      --accent: #4f7cff;
      --accent-2: #9b59ff;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 8px 24px rgba(31, 36, 48, 0.08);
      --shadow-hover: 0 16px 40px rgba(79, 124, 255, 0.18);
    }

    /* ===== 深色模式 ===== */
    [data-theme="dark"] {
      --bg: #12141c;
      --bg-card: #1b1e2a;
      --text: #e8eaf2;
      --text-sub: #9aa1b2;
      --accent: #6d93ff;
      --accent-2: #b57bff;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 16px 40px rgba(109, 147, 255, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
    }

    /* ===== 背景装饰光斑 ===== */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { width: 480px; height: 480px; background: var(--accent); top: -160px; right: -120px; }
    .glow-2 { width: 380px; height: 380px; background: var(--accent-2); bottom: -140px; left: -100px; }

    main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航 ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0;
    }
    .logo { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .logo span { color: var(--accent); }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .theme-btn:hover { transform: rotate(30deg) scale(1.1); }

    /* ===== 首屏区域 ===== */
    .hero { text-align: center; padding: 72px 0 56px; }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--shadow-hover);
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: clamp(15px, 2.5vw, 19px);
      color: var(--text-sub);
      max-width: 560px;
      margin: 0 auto 32px;
    }
    .tagline .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: -0.15em;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ===== 社交链接按钮 ===== */
    .social-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .social-btn:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    /* ===== 分区标题 ===== */
    section h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    section h2::before {
      content: "";
      width: 6px;
      height: 26px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    /* ===== 项目卡片网格 ===== */
    .projects-section { padding: 40px 0 64px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      opacity: 0;
      transform: translateY(24px);
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px) !important;
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }
    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .card h3 { font-size: 19px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: var(--text-sub); margin-bottom: 18px; min-height: 44px; }
    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .card-link:hover { text-decoration: underline; }
    .card-links { display: flex; gap: 12px; margin-top: 12px; align-items: center; }

    /* ===== 「快速使用」按钮 ===== */
    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }
    .btn-play:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); filter: brightness(1.08); }

    .section-sub { color: var(--text-sub); font-size: 14px; margin: -16px 0 24px; }
    .loading { color: var(--text-sub); font-size: 14px; }

    /* ===== 页脚 ===== */
    footer {
      text-align: center;
      padding: 36px 24px 48px;
      color: var(--text-sub);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ===== 小屏适配 ===== */
    @media (max-width: 520px) {
      .hero { padding: 48px 0 40px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main>
    <!-- 顶部：站名 + 深色模式开关 -->
    <header>
      <div class="logo">乔治亚<span>.lab</span></div>
      <button class="theme-btn" id="themeBtn" title="切换深色 / 浅色模式" aria-label="切换主题">🌙</button>
    </header>

    <!-- 首屏 -->
    <section class="hero">
      <div class="avatar" style="background-image: url('https://avatars.githubusercontent.com/u/295380872'); background-size: cover; background-position: center;"></div>
      <h1>你好，我是神奇的乔治亚</h1>
      <p class="tagline">
        <span id="typewriter"></span><span class="cursor"></span>
      </p>
      <nav class="social-links">
        <a class="social-btn" href="https://github.com/sqdqzy" target="_blank" rel="noopener">🐙 GitHub</a>
        <a class="social-btn" href="https://gitee.com/sqdqzy" target="_blank" rel="noopener">🦅 Gitee</a>
        <a class="social-btn" href="https://space.bilibili.com/630509429" target="_blank" rel="noopener">📺 哔哩哔哩</a>
      </nav>
    </section>

    <!-- 项目索引区：上 · HTML 项目（打开即用） -->
    <section class="projects-section">
      <h2>我的 HTML 项目</h2>
      <p class="section-sub">托管在本站、打开即用的网页项目</p>
      <div class="grid" id="htmlGrid"></div>
    </section>

    <!-- 项目索引区：下 · 其他项目（GitHub / Gitee 仓库） -->
    <section class="projects-section" style="padding-top: 0;">
      <h2>其他项目</h2>
      <p class="section-sub">托管在 GitHub / Gitee 上的代码仓库</p>
      <div class="grid" id="repoGrid"></div>
    </section>
  </main>

  <footer>
    <p>本页所有项目均与 <a href="https://github.com/sst/opencode" target="_blank" rel="noopener">OpenCode</a> 共同创作 🤝</p>
    <p>© 2026 神奇的乔治亚 · Powered by GitHub Pages</p>
  </footer>

  <script>
    // ===== 打字机效果 =====
    const sentences = [
      "上面是我的 HTML 项目，点开即用",
      "下面是我的代码仓库",
      "所有项目与 OpenCode 共同创作"
    ];
    const typeTarget = document.getElementById("typewriter");
    let si = 0, ci = 0, deleting = false;

    function typeLoop() {
      const current = sentences[si];
      typeTarget.textContent = current.slice(0, ci);
      let delay = deleting ? 40 : 110;

      if (!deleting && ci === current.length) {
        delay = 2000;           // 整句停留
        deleting = true;
      } else if (deleting && ci === 0) {
        deleting = false;
        si = (si + 1) % sentences.length;
        delay = 400;
      } else {
        ci += deleting ? -1 : 1;
      }
      setTimeout(typeLoop, delay);
    }
    typeLoop();

    // ===== 深色 / 浅色模式切换（记忆用户选择）=====
    // 注意：iOS 隐私模式等环境下 localStorage 读写会直接抛异常，
    // 必须全程 try/catch，否则脚本在绑定按钮事件前就会中断，导致无法切换主题。
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 隐私模式下忽略 */ } }
    };

    const themeBtn = document.getElementById("themeBtn");
    let currentTheme = "light";
    try {
      const savedTheme = store.get("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      currentTheme = savedTheme || (prefersDark ? "dark" : "light");
    } catch (e) { /* 保持浅色 */ }

    function applyTheme(mode) {
      currentTheme = mode;
      document.documentElement.setAttribute("data-theme", mode);
      themeBtn.textContent = mode === "dark" ? "☀️" : "🌙";
      store.set("theme", mode);
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener("click", () => {
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    });

    // ===== 卡片滚动入场动画 =====
    function initScrollAnimation(root) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add("visible"), i * 120);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      root.querySelectorAll(".card").forEach(card => observer.observe(card));
    }

    // ===== 板块一：HTML 项目 =====
    // 动态获取方式：读取本仓库根目录的文件夹。
    // 约定：根目录下每个同时包含 index.html 和 简介.txt 的文件夹即为一个 HTML 项目；
    // 简介.txt 第一行为标题，其余行为简介。
    const REPO_CONTENTS = 'https://api.github.com/repos/sqdqzy/sqdqzy.github.io/contents/';

    async function loadHtmlProjects() {
      const res = await fetch(REPO_CONTENTS);
      if (!res.ok) throw new Error('GitHub API 请求失败');
      const items = await res.json();
      const dirs = items.filter(i => i.type === 'dir');
      const out = [];
      for (const d of dirs) {
        try {
          const r = await fetch(REPO_CONTENTS + encodeURIComponent(d.name) + '/' + encodeURIComponent('简介.txt'));
          if (!r.ok) continue;   // 缺少简介.txt 的文件夹不算 HTML 项目
          const j = await r.json();
          const text = new TextDecoder().decode(Uint8Array.from(atob((j.content || '').replace(/\s/g, '')), c => c.charCodeAt(0)));
          const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
          if (lines.length === 0) continue;
          out.push({ name: d.name, title: lines[0], desc: lines.slice(1).join(' ') || '点击快速使用' });
        } catch (e) { /* 跳过读取异常的文件夹 */ }
      }
      return out;
    }

    async function renderHtmlProjects() {
      const grid = document.getElementById('htmlGrid');
      grid.innerHTML = '<p class="loading">正在加载 HTML 项目...</p>';
      try {
        const list = await loadHtmlProjects();
        grid.innerHTML = list.length === 0
          ? '<p class="loading">暂无 HTML 项目（往仓库根目录放「项目文件夹 + index.html + 简介.txt」即可自动出现）</p>'
          : list.map(p => `
            <article class="card">
              <div class="card-icon">🎮</div>
              <h3>${p.title}</h3>
              <p>${p.desc}</p>
              <div class="card-links">
                <a class="btn-play" href="./${p.name}/" target="_blank" rel="noopener">▶ 快速使用</a>
              </div>
            </article>`).join('');
        initScrollAnimation(grid);
      } catch (error) {
        grid.innerHTML = '<p class="loading">HTML 项目加载失败，请刷新重试</p>';
      }
    }

    // ===== 板块二：其他项目（动态加载 GitHub 和 Gitee 仓库）=====
    async function fetchGitHubRepos(username) {
      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos`);
        if (!response.ok) throw new Error('GitHub API 请求失败');
        const repos = await response.json();
        return repos.map(repo => ({
          name: repo.name,
          description: repo.description || '暂无描述',
          url: repo.html_url,
          platform: 'github'
        }));
      } catch (error) {
        console.error('获取 GitHub 仓库失败:', error);
        return [];
      }
    }

    async function fetchGiteeRepos(username) {
      try {
        const response = await fetch(`https://gitee.com/api/v5/users/${username}/repos`);
        if (!response.ok) throw new Error('Gitee API 请求失败');
        const repos = await response.json();
        return repos.map(repo => ({
          name: repo.name,
          description: repo.description || '暂无描述',
          url: repo.html_url,
          platform: 'gitee'
        }));
      } catch (error) {
        console.error('获取 Gitee 仓库失败:', error);
        return [];
      }
    }

    async function loadRepoProjects() {
      const username = 'sqdqzy';
      const [githubRepos, giteeRepos] = await Promise.all([
        fetchGitHubRepos(username),
        fetchGiteeRepos(username)
      ]);

      const repoMap = new Map();
      githubRepos.forEach(repo => {
        if (repo.name === 'sqdqzy.github.io') return;   // 主页仓库本身不展示
        repoMap.set(repo.name, {
          title: repo.name,
          desc: repo.description,
          github: repo.url,
          gitee: null
        });
      });

      giteeRepos.forEach(repo => {
        if (repo.name === 'sqdqzy.github.io') return;
        if (repoMap.has(repo.name)) {
          repoMap.get(repo.name).gitee = repo.url;
        } else {
          repoMap.set(repo.name, {
            title: repo.name,
            desc: repo.description,
            github: null,
            gitee: repo.url
          });
        }
      });

      return Array.from(repoMap.values());
    }

    async function renderRepoProjects() {
      const grid = document.getElementById('repoGrid');
      grid.innerHTML = '<p class="loading">正在加载项目列表...</p>';
      try {
        const projects = await loadRepoProjects();
        if (projects.length === 0) {
          grid.innerHTML = '<p class="loading">暂无项目或加载失败</p>';
          return;
        }

        grid.innerHTML = projects.map(p => {
          let links = '';
          if (p.github) {
            links += `<a class="card-link" href="${p.github}" target="_blank" rel="noopener">GitHub</a>`;
          }
          if (p.gitee) {
            links += `<a class="card-link" href="${p.gitee}" target="_blank" rel="noopener">Gitee</a>`;
          }
          return `
            <article class="card">
              <div class="card-icon">📦</div>
              <h3>${p.title}</h3>
              <p>${p.desc}</p>
              <div class="card-links">
                ${links}
              </div>
            </article>
          `;
        }).join("");

        initScrollAnimation(grid);
      } catch (error) {
        grid.innerHTML = '<p class="loading">项目加载失败，请刷新重试</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHtmlProjects();
      renderRepoProjects();
    });
  </script>
</body>
</html>
